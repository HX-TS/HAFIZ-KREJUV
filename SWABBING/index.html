<html lang="en">

  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {

      --black: #050505;

      --cream: #f2efe9;

      --cream-2: #ebe8e2;

      --line: #cbc7bf;

      --grey: #5b5751;

      /*
         DEW POINT DATE GROUP COLOURS
         MUTED / PROFESSIONAL
      */

      --date-1: #f2efe9;
      --date-2: #e3e8e4;
      --date-3: #ece6dc;
      --date-4: #e1e5e9;
      --date-5: #e8e2e6;
      --date-6: #e4e7dc;

    }


    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html,
    body {

      width: 100%;

      height: 100%;

    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--black);

      color:
        var(--black);

      overflow: hidden;

    }



    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width: 100%;

      height: 100dvh;

      display: flex;

      flex-direction: column;

      padding: 7px;

      gap: 7px;

      background:
        var(--black);

    }



    /* =========================================================
       HEADER
    ========================================================= */

    .hero {

      flex-shrink: 0;

      height: 102px;

      min-height: 102px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(285px, 330px)
        190px;

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }



    /* =========================================================
       HEADER TITLE
    ========================================================= */

    .hero-left {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        14px
        24px;

    }


    .hero-title {

      font-size:
        clamp(
          28px,
          3.1vw,
          48px
        );

      font-weight: 900;

      line-height: 0.92;

      letter-spacing: -0.045em;

      text-transform: uppercase;

    }


    .hero-subtitle {

      margin-top: 8px;

      color:
        var(--grey);

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 0.28em;

      text-transform: uppercase;

    }



    /* =========================================================
       CURRENT DATE / TIME / SHIFT
    ========================================================= */

    .current-status {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        14px
        20px;

      border-left:
        1px solid
        var(--black);

      background:
        var(--cream);

    }


    .current-datetime {

      font-size:
        clamp(
          16px,
          1.25vw,
          20px
        );

      line-height: 1;

      font-weight: 900;

      letter-spacing: 0.025em;

      font-variant-numeric:
        tabular-nums;

      white-space: nowrap;

    }


    .current-shift {

      margin-top: 10px;

      color:
        var(--grey);

      font-size: 10px;

      line-height: 1.25;

      font-weight: 900;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .current-shift strong {

      color:
        var(--black);

    }



    /* =========================================================
       MAIN BOOKMARK
    ========================================================= */

    .main-bookmark {

      min-width: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        15px
        20px;

      border-left:
        1px solid
        var(--black);

      background:
        var(--cream);

      color:
        var(--black);

      text-decoration: none;

      text-align: center;

      font-size: 12px;

      line-height: 1.2;

      font-weight: 900;

      letter-spacing: 0.05em;

      text-transform: uppercase;

      transition:
        background 0.15s ease,
        color 0.15s ease;

    }


    .main-bookmark:hover,
    .main-bookmark:focus-visible {

      background:
        var(--black);

      color:
        #ffffff;

      outline: none;

    }


    .bookmark-arrow {

      margin-left: 9px;

      font-size: 18px;

      font-weight: 900;

    }



    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {

      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;

    }



    /* =========================================================
       PANEL
    ========================================================= */

    .reading-panel {

      min-height: 0;

      display: flex;

      flex-direction: column;

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }


    .panel-title {

      flex-shrink: 0;

      min-height: 42px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding:
        0
        16px;

      background:
        var(--cream);

      border-bottom:
        1px solid
        var(--line);

      font-size: 13px;

      font-weight: 900;

      letter-spacing: 0.03em;

      text-transform: uppercase;

    }


    .panel-note {

      flex-shrink: 0;

      color:
        var(--grey);

      font-size: 8px;

      font-weight: 800;

      letter-spacing: 0.08em;

      text-align: right;

      text-transform: uppercase;

    }



    /* =========================================================
       TABLE WRAPPER
    ========================================================= */

    .table-wrapper {

      flex: 1;

      min-height: 0;

      overflow-x: auto;

      overflow-y: auto;

      background:
        var(--cream);

      scrollbar-width: thin;

      scrollbar-color:
        #888
        var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar {

      width: 8px;

      height: 8px;

    }


    .table-wrapper::-webkit-scrollbar-track {

      background:
        var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar-thumb {

      background:
        #888;

    }



    /* =========================================================
       TABLE
    ========================================================= */

    table {

      width: 100%;

      min-width: max-content;

      border-collapse: collapse;

      table-layout: auto;

      background:
        var(--cream);

    }


    thead {

      position: sticky;

      top: 0;

      z-index: 20;

    }


    th {

      min-width: 125px;

      height: 48px;

      padding:
        8px
        12px;

      background:
        var(--cream);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--black);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 11px;

      line-height: 1.15;

      font-weight: 900;

      text-transform: uppercase;

    }


    td {

      min-width: 125px;

      height: 37px;

      padding:
        7px
        12px;

      background:
        var(--cream);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size: 12px;

      line-height: 1.15;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

    }


    th:last-child,
    td:last-child {

      border-right: none;

    }



    /* =========================================================
       DEW POINT - DIFFERENT COLOUR FOR EACH DATE

       SAME DATE = SAME COLOUR

       NEXT DATE = NEXT COLOUR
    ========================================================= */

    #dewPointContainer
    tbody
    tr.date-group-0
    td {

      background:
        var(--date-1);

    }


    #dewPointContainer
    tbody
    tr.date-group-1
    td {

      background:
        var(--date-2);

    }


    #dewPointContainer
    tbody
    tr.date-group-2
    td {

      background:
        var(--date-3);

    }


    #dewPointContainer
    tbody
    tr.date-group-3
    td {

      background:
        var(--date-4);

    }


    #dewPointContainer
    tbody
    tr.date-group-4
    td {

      background:
        var(--date-5);

    }


    #dewPointContainer
    tbody
    tr.date-group-5
    td {

      background:
        var(--date-6);

    }



    /* =========================================================
       CLEAR LINE WHEN DATE CHANGES
    ========================================================= */

    #dewPointContainer
    tbody
    tr.new-date-group
    td {

      border-top:
        2px solid
        var(--black);

    }



    /* =========================================================
       LATEST DATE

       ALL DATA FOR LATEST CALENDAR DATE IS BOLD
    ========================================================= */

    #dewPointContainer
    tbody
    tr.latest-date
    td {

      font-weight: 900;

    }



    /* =========================================================
       LOWEST VALUE

       EXTRA BOLD
    ========================================================= */

    td.lowest-value {

      font-weight: 900;

      text-decoration:
        underline;

      text-decoration-thickness:
        2px;

      text-underline-offset:
        3px;

    }



    /* =========================================================
       HOVER
    ========================================================= */

    tbody tr:hover td {

      filter:
        brightness(0.95);

    }



    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {

      width: 100%;

      height: 100%;

      min-height: 90px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      text-align: center;

      font-size: 11px;

      line-height: 1.5;

      font-weight: 800;

      text-transform: uppercase;

    }



    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      flex-shrink: 0;

      min-height: 34px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        6px
        10px
        max(
          6px,
          env(safe-area-inset-bottom)
        );

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;

    }



    /* =========================================================
       SMALL LAPTOP
    ========================================================= */

    @media (max-width: 1200px) {

      .hero {

        grid-template-columns:
          minmax(0, 1fr)
          270px
          165px;

      }


      .hero-left {

        padding:
          12px
          18px;

      }


      .hero-title {

        font-size:
          clamp(
            25px,
            3.5vw,
            40px
          );

      }


      .current-status {

        padding:
          12px
          14px;

      }


      .current-datetime {

        font-size: 15px;

      }


      .current-shift {

        font-size: 9px;

      }


      .main-bookmark {

        padding:
          12px
          14px;

        font-size: 10px;

      }

    }



    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .page {

        padding:
          max(
            3px,
            env(safe-area-inset-top)
          )
          3px
          max(
            3px,
            env(safe-area-inset-bottom)
          );

        gap: 3px;

      }


      .hero {

        height: 116px;

        min-height: 116px;

        grid-template-columns:
          minmax(0, 1fr)
          110px;

        grid-template-rows:
          60px
          56px;

      }


      .hero-left {

        grid-column:
          1 / -1;

        grid-row:
          1;

        padding:
          7px
          10px;

        border-bottom:
          1px solid
          var(--black);

      }


      .hero-title {

        font-size:
          clamp(
            20px,
            6vw,
            27px
          );

      }


      .hero-subtitle {

        margin-top: 4px;

        font-size: 6px;

      }


      .current-status {

        grid-column:
          1;

        grid-row:
          2;

        padding:
          7px
          10px;

        border-left:
          none;

      }


      .current-datetime {

        font-size:
          clamp(
            12px,
            3.7vw,
            15px
          );

      }


      .current-shift {

        margin-top: 5px;

        font-size: 6.5px;

      }


      .main-bookmark {

        grid-column:
          2;

        grid-row:
          2;

        padding:
          6px;

        font-size: 7.5px;

      }


      .bookmark-arrow {

        margin-left: 4px;

        font-size: 12px;

      }


      .dashboard {

        gap: 3px;

      }


      .panel-title {

        min-height: 31px;

        padding:
          0
          8px;

        gap: 5px;

        font-size: 9px;

      }


      .panel-note {

        font-size: 5.5px;

        letter-spacing: 0.02em;

      }


      th {

        min-width: 100px;

        height: 38px;

        padding:
          6px
          7px;

        font-size: 8px;

      }


      td {

        min-width: 100px;

        height: 30px;

        padding:
          5px
          7px;

        font-size: 9px;

      }


      .footer {

        min-height: 25px;

        font-size: 7px;

      }

    }

  </style>

</head>



<body>


  <div class="page">


    <!-- =====================================================

    <!-- =====================================================

    <main class="dashboard">


      <!-- ===================================================

      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">


          <div>

      <!-- ===================================================

      ==================================================== -->

      <section class="reading-panel">

  <script>


    /* =========================================================
       SETTINGS
    ========================================================= */

    const TABLE_REFRESH_TIME =
      60000;


    const MALAYSIA_TIME_ZONE =
      "Asia/Kuala_Lumpur";


    const DATE_GROUP_COLOUR_COUNT =
      6;



    /* =========================================================
       GOOGLE SHEETS
    ========================================================= */

    const SWABBING = {


      spreadsheetId:

        "1dPQfygx00SWQLDKmLbK1zyKX5by40ub6xZqm1VAUaDs",


      gid:

        "0",


      range:

        "A:Z",


      container:

        "swabbingContainer",


      callback:

        "swabbingResponse",


      hiddenColumns: [

        "TIMESTAMP"

      ],


      sortByDateTime:

        true,


      highlightLowest:

        false,


      groupByDate:

        false


    };



    const DEW_POINT = {


      spreadsheetId:

        "1vdrb81qWoamvrjqI-t6nSOUjYlK1ldnMxKduUAZxTWM",


      gid:

        "0",


      range:

        "A:Z",


      container:

        "dewPointContainer",


      callback:

        "dewPointResponse",


      hiddenColumns: [

        "TIMESTAMP"

      ],


      sortByDateTime:

        true,


      highlightLowest:

        true,


      groupByDate:

        true


    };



    /* =========================================================
       CURRENT MALAYSIA TIME
    ========================================================= */

    function getMalaysiaParts() {


      const formatter =

        new Intl.DateTimeFormat(

          "en-GB",

          {

            timeZone:
              MALAYSIA_TIME_ZONE,

            year:
              "numeric",

            month:
              "short",

            day:
              "2-digit",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hourCycle:
              "h23"

          }

        );


      const parts =

        formatter.formatToParts(
          new Date()
        );


      const result =
        {};


      parts.forEach(

        function (part) {


          if (
            part.type !== "literal"
          ) {


            result[
              part.type
            ] =
              part.value;


          }


        }

      );


      return result;

    }



    /* =========================================================
       UPDATE HEADER CLOCK

       DAY:
       07:00 - 18:59

       NIGHT:
       19:00 - 06:59
    ========================================================= */

    function updateCurrentTime() {


      const parts =
        getMalaysiaParts();


      const month =
        String(
          parts.month || ""
        )
        .toUpperCase();


      const dateText =

        parts.day

        +

        " "

        +

        month

        +

        " "

        +

        parts.year

        +

        " "

        +

        parts.hour

        +

        ":"

        +

        parts.minute

        +

        ":"

        +

        parts.second;


      document
        .getElementById(
          "currentDateTime"
        )
        .textContent =
          dateText;


      const hour =

        Number(
          parts.hour
        );


      const isDayShift =

        hour >= 7

        &&

        hour <= 18;


      const shiftElement =

        document.getElementById(
          "currentShift"
        );


      if (isDayShift) {


        shiftElement.innerHTML =

          "CURRENT SHIFT: <strong>DAY</strong> · 07:00 - 18:59";


      }


      else {


        shiftElement.innerHTML =

          "CURRENT SHIFT: <strong>NIGHT</strong> · 19:00 - 06:59";


      }


    }



    updateCurrentTime();


    setInterval(

      updateCurrentTime,

      1000

    );



    /* =========================================================
       TEXT NORMALIZATION
    ========================================================= */

    function normalizeText(value) {


      return String(
        value || ""
      )

      .trim()

      .toUpperCase();

    }



    /* =========================================================
       CELL VALUE
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );


    }



    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }


      if (

        cell.f !== undefined

        &&

        cell.f !== null

        &&

        cell.f !== ""

      ) {


        return cell.f;


      }


      if (

        cell.v !== undefined

        &&

        cell.v !== null

      ) {


        return cell.v;


      }


      return "";

    }



    /* =========================================================
       NUMBER
    ========================================================= */

    function extractNumber(value) {


      if (

        value === null

        ||

        value === undefined

        ||

        value === ""

      ) {


        return null;


      }


      if (
        typeof value === "number"
      ) {


        return Number.isFinite(
          value
        )
          ? value
          : null;


      }


      const match =

        String(value)

        .replace(
          /,/g,
          ""
        )

        .replace(
          /−/g,
          "-"
        )

        .match(
          /[-+]?\d+(?:\.\d+)?/
        );


      if (!match) {

        return null;

      }


      const number =

        parseFloat(
          match[0]
        );


      return Number.isFinite(
        number
      )
        ? number
        : null;

    }



    /* =========================================================
       COLUMN TYPES
    ========================================================= */

    function isTimestampColumn(name) {


      const n =
        normalizeText(
          name
        );


      return n.includes(
        "TIMESTAMP"
      );

    }



    function isDateColumn(name) {


      const n =
        normalizeText(
          name
        );


      return (

        n === "DATE"

        ||

        n === "TARIKH"

        ||

        n.startsWith(
          "DATE "
        )

        ||

        n.startsWith(
          "TARIKH "
        )

        ||

        n.endsWith(
          " DATE"
        )

      );

    }



    function isTimeColumn(name) {


      const n =
        normalizeText(
          name
        );


      if (
        isTimestampColumn(n)
      ) {

        return false;

      }


      return (

        n === "TIME"

        ||

        n === "SAMPLING TIME"

        ||

        n.includes(
          "MASA"
        )

        ||

        n.includes(
          "HRS"
        )

        ||

        n.startsWith(
          "TIME "
        )

        ||

        n.endsWith(
          " TIME"
        )

      );

    }



    /* =========================================================
       HEADER DISPLAY NAME

       GOOGLE SHEET:
       MASA AMBIL GAMBARAJAH

       WEBPAGE:
       SAMPLING TIME
    ========================================================= */

    function getDisplayHeaderName(name) {


      const normalized =
        normalizeText(
          name
        );


      if (

        normalized ===
        "MASA AMBIL GAMBARAJAH"

      ) {


        return "SAMPLING TIME";


      }


      return name || "";

    }



    /* =========================================================
       HIDDEN COLUMN
    ========================================================= */

    function shouldHideColumn(
      label,
      config
    ) {


      const name =
        normalizeText(
          label
        );


      if (
        isTimestampColumn(
          name
        )
      ) {

        return true;

      }


      return (

        config.hiddenColumns || []

      )
      .map(
        normalizeText
      )
      .some(

        function (hidden) {


          return (

            name === hidden

            ||

            name.includes(
              hidden
            )

          );


        }

      );

    }



    /* =========================================================
       PARSE DATE
    ========================================================= */

    function parseDateCell(cell) {


      if (!cell) {

        return null;

      }


      if (
        cell.v instanceof Date
      ) {


        return new Date(

          cell.v.getFullYear(),

          cell.v.getMonth(),

          cell.v.getDate()

        )
        .getTime();


      }


      const candidates = [

        cell.f,

        cell.v

      ];


      for (
        const candidate
        of candidates
      ) {


        if (

          candidate === null

          ||

          candidate === undefined

          ||

          candidate === ""

        ) {

          continue;

        }


        const text =

          String(candidate)
          .trim();


        let match =

          text.match(

            /Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]),

            Number(match[3])

          )
          .getTime();


        }



        match =

          text.match(

            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/

          );


        if (match) {


          return new Date(

            Number(match[3]),

            Number(match[2]) - 1,

            Number(match[1])

          )
          .getTime();


        }



        match =

          text.match(

            /^(\d{4})-(\d{1,2})-(\d{1,2})$/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]) - 1,

            Number(match[3])

          )
          .getTime();


        }



        const parsed =

          Date.parse(
            text
          );


        if (
          Number.isFinite(
            parsed
          )
        ) {


          const date =
            new Date(
              parsed
            );


          return new Date(

            date.getFullYear(),

            date.getMonth(),

            date.getDate()

          )
          .getTime();


        }


      }


      return null;

    }



    /* =========================================================
       TIME
    ========================================================= */

    function parseTimeCell(cell) {


      if (!cell) {

        return 0;

      }


      if (
        cell.v instanceof Date
      ) {


        return (

          cell.v.getHours() * 3600000

          +

          cell.v.getMinutes() * 60000

          +

          cell.v.getSeconds() * 1000

        );


      }


      if (

        typeof cell.v === "number"

        &&

        cell.v >= 0

        &&

        cell.v < 1

      ) {


        return Math.round(

          cell.v * 86400000

        );


      }


      const value =

        String(

          cell.f !== undefined

          ?

          cell.f

          :

          cell.v || ""

        )

        .trim()

        .toUpperCase()

        .replace(
          /\./g,
          ":"
        );


      let match =

        value.match(

          /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(?:HRS?)?$/

        );


      if (match) {


        return (

          Number(match[1]) * 3600000

          +

          Number(match[2]) * 60000

          +

          Number(match[3] || 0) * 1000

        );


      }


      match =

        value.match(

          /^(\d{3,4})\s*(?:HRS?)?$/

        );


      if (match) {


        const digits =

          match[1]
          .padStart(
            4,
            "0"
          );


        return (

          Number(
            digits.slice(
              0,
              2
            )
          )
          *
          3600000

          +

          Number(
            digits.slice(
              2,
              4
            )
          )
          *
          60000

        );


      }


      return 0;

    }



    /* =========================================================
       DATE / TIME COLUMN INDEX
    ========================================================= */

    function findDateTimeColumns(columns) {


      let dateIndex =
        -1;


      let timeIndex =
        -1;


      columns.forEach(

        function (
          column,
          index
        ) {


          const label =
            column.label || "";


          if (

            dateIndex === -1

            &&

            isDateColumn(
              label
            )

          ) {


            dateIndex =
              index;


          }


          if (

            timeIndex === -1

            &&

            isTimeColumn(
              label
            )

          ) {


            timeIndex =
              index;


          }


        }

      );


      return {

        dateIndex,

        timeIndex

      };

    }



    /* =========================================================
       DATE ONLY VALUE
    ========================================================= */

    function getRowDateValue(
      row,
      dateIndex
    ) {


      if (

        dateIndex < 0

        ||

        !row.c

      ) {


        return null;


      }


      return parseDateCell(

        row.c[
          dateIndex
        ]

      );

    }



    /* =========================================================
       DATE + TIME VALUE
    ========================================================= */

    function getRowDateTimeValue(
      row,
      dateIndex,
      timeIndex
    ) {


      const dateValue =

        getRowDateValue(
          row,
          dateIndex
        );


      if (
        dateValue === null
      ) {


        return null;


      }


      const timeValue =

        timeIndex >= 0

          ?

          parseTimeCell(

            row.c[
              timeIndex
            ]

          )

          :

          0;


      return (

        dateValue

        +

        timeValue

      );

    }



    /* =========================================================
       SORT OLDEST -> NEWEST
    ========================================================= */

    function sortRowsByDateTime(
      rows,
      columns
    ) {


      const indexes =

        findDateTimeColumns(
          columns
        );


      if (
        indexes.dateIndex < 0
      ) {


        return rows;


      }


      return rows

      .map(

        function (
          row,
          index
        ) {


          return {

            row,

            index,

            dateTime:

              getRowDateTimeValue(

                row,

                indexes.dateIndex,

                indexes.timeIndex

              )

          };


        }

      )

      .sort(

        function (
          a,
          b
        ) {


          const aValid =

            Number.isFinite(
              a.dateTime
            );


          const bValid =

            Number.isFinite(
              b.dateTime
            );


          if (
            !aValid && bValid
          ) {

            return -1;

          }


          if (
            aValid && !bValid
          ) {

            return 1;

          }


          if (
            !aValid && !bValid
          ) {


            return a.index - b.index;


          }


          if (
            a.dateTime !== b.dateTime
          ) {


            return a.dateTime - b.dateTime;


          }


          return a.index - b.index;


        }

      )

      .map(

        function (item) {

          return item.row;

        }

      );

    }



    /* =========================================================
       VISIBLE COLUMNS
    ========================================================= */

    function getVisibleColumns(
      columns,
      rows,
      config
    ) {


      const visible =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          if (

            shouldHideColumn(
              column.label,
              config
            )

          ) {


            return;


          }


          const hasData =

            rows.some(

              function (row) {


                return (

                  row.c

                  &&

                  cellHasValue(

                    row.c[
                      index
                    ]

                  )

                );


              }

            );


          if (

            normalizeText(
              column.label
            ) !== ""

            ||

            hasData

          ) {


            visible.push({

              column,

              index

            });


          }


        }

      );


      return visible;

    }



    /* =========================================================
       EMPTY ROW FILTER
    ========================================================= */

    function getNonEmptyRows(
      rows,
      visibleColumns
    ) {


      return rows.filter(

        function (row) {


          return visibleColumns.some(

            function (item) {


              return (

                row.c

                &&

                cellHasValue(

                  row.c[
                    item.index
                  ]

                )

              );


            }

          );


        }

      );

    }



    /* =========================================================
       LOWEST VALUES
    ========================================================= */

    function findLowestValues(
      rows,
      visibleColumns
    ) {


      const result =
        new Map();


      visibleColumns.forEach(

        function (item) {


          const label =
            item.column.label || "";


          if (

            isDateColumn(
              label
            )

            ||

            isTimeColumn(
              label
            )

            ||

            isTimestampColumn(
              label
            )

          ) {


            return;


          }


          let minimum =
            null;


          rows.forEach(

            function (row) {


              const cell =

                row.c

                ?

                row.c[
                  item.index
                ]

                :

                null;


              const number =

                extractNumber(

                  getCellDisplayValue(
                    cell
                  )

                );


              if (
                number === null
              ) {


                return;


              }


              if (

                minimum === null

                ||

                number < minimum

              ) {


                minimum =
                  number;


              }


            }

          );


          if (
            minimum !== null
          ) {


            result.set(

              item.index,

              minimum

            );


          }


        }

      );


      return result;

    }



    /* =========================================================
       LOAD GOOGLE SHEET

       SELECT *

       SO MANUAL ROWS WITH BLANK TIMESTAMP ARE INCLUDED.
    ========================================================= */

    function loadSheet(config) {


      const query =
        "select *";


      const tqx =

        `out:json;responseHandler:${config.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        config.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        config.gid

        +

        "&range="

        +

        encodeURIComponent(
          config.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();


      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;


      script.onerror =

        function () {


          const container =

            document.getElementById(
              config.container
            );


          container.innerHTML =

            '<div class="message">' +

            'Unable to Load Google Sheet Data' +

            '<br>' +

            'Check Google Sheet Sharing Permission' +

            '</div>';


        };


      script.onload =

        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {


                script.remove();


              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );

    }



    /* =========================================================
       SCROLL TO LATEST
    ========================================================= */

    function scrollTableToBottom(container) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );

    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =

        document.getElementById(
          config.container
        );


      if (

        !response

        ||

        !response.table

      ) {


        container.innerHTML =

          '<div class="message">No Data Available</div>';


        return;


      }


      const columns =

        response.table.cols || [];


      const originalRows =

        response.table.rows || [];


      const visibleColumns =

        getVisibleColumns(

          columns,

          originalRows,

          config

        );


      let rows =

        getNonEmptyRows(

          originalRows,

          visibleColumns

        );


      if (
        rows.length === 0
      ) {


        container.innerHTML =

          '<div class="message">No Readings Available</div>';


        return;


      }



      /* =======================================================
         SORT DATE + SAMPLING TIME
      ======================================================= */

      if (
        config.sortByDateTime
      ) {


        rows =

          sortRowsByDateTime(

            rows,

            columns

          );


      }



      const dateTimeColumns =

        findDateTimeColumns(
          columns
        );



      /* =======================================================
         FIND LATEST CALENDAR DATE

         NOT LATEST TIMESTAMP.
      ======================================================= */

      let latestDateValue =
        null;


      if (
        dateTimeColumns.dateIndex >= 0
      ) {


        rows.forEach(

          function (row) {


            const value =

              getRowDateValue(

                row,

                dateTimeColumns.dateIndex

              );


            if (

              Number.isFinite(
                value
              )

              &&

              (
                latestDateValue === null

                ||

                value > latestDateValue
              )

            ) {


              latestDateValue =
                value;


            }


          }

        );


      }



      /* =======================================================
         LOWEST VALUES
      ======================================================= */

      const lowestValues =

        config.highlightLowest

          ?

          findLowestValues(

            rows,

            visibleColumns

          )

          :

          new Map();



      /* =======================================================
         TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );


      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );


      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            getDisplayHeaderName(

              item.column.label || ""

            );


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );


      const tbody =

        document.createElement(
          "tbody"
        );



      /* =======================================================
         DATE GROUPING
      ======================================================= */

      const dateColourMap =
        new Map();


      let nextColourIndex =
        0;


      let previousDate =
        null;



      rows.forEach(

        function (row) {


          const tr =

            document.createElement(
              "tr"
            );


          const rowDate =

            dateTimeColumns.dateIndex >= 0

              ?

              getRowDateValue(

                row,

                dateTimeColumns.dateIndex

              )

              :

              null;



          /* =================================================
             DIFFERENT COLOUR BY DATE
          ================================================= */

          if (

            config.groupByDate

            &&

            Number.isFinite(
              rowDate
            )

          ) {


            const dateKey =

              String(
                rowDate
              );


            if (
              !dateColourMap.has(
                dateKey
              )
            ) {


              dateColourMap.set(

                dateKey,

                nextColourIndex %
                DATE_GROUP_COLOUR_COUNT

              );


              nextColourIndex++;


            }


            const colourIndex =

              dateColourMap.get(
                dateKey
              );


            tr.classList.add(

              "date-group-" +
              colourIndex

            );


            if (

              previousDate !== null

              &&

              rowDate !== previousDate

            ) {


              tr.classList.add(
                "new-date-group"
              );


            }


            previousDate =
              rowDate;


          }



          /* =================================================
             ALL DATA ON LATEST DATE = BOLD
          ================================================= */

          if (

            config.groupByDate

            &&

            latestDateValue !== null

            &&

            rowDate === latestDateValue

          ) {


            tr.classList.add(
              "latest-date"
            );


          }



          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                  ?

                  row.c[
                    item.index
                  ]

                  :

                  null;


              const displayValue =

                getCellDisplayValue(
                  cell
                );


              td.textContent =
                displayValue;



              /* =============================================
                 LOWEST READING
              ============================================= */

              if (

                config.highlightLowest

                &&

                lowestValues.has(
                  item.index
                )

              ) {


                const number =

                  extractNumber(
                    displayValue
                  );


                const minimum =

                  lowestValues.get(
                    item.index
                  );


                if (

                  number !== null

                  &&

                  Math.abs(

                    number - minimum

                  )

                  < 0.000001

                ) {


                  td.classList.add(
                    "lowest-value"
                  );


                }


              }


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


        }

      );


      table.appendChild(
        tbody
      );


      container.innerHTML =
        "";


      container.appendChild(
        table
      );


      scrollTableToBottom(
        container
      );

    }



    /* =========================================================
       CALLBACKS
    ========================================================= */

    window.swabbingResponse =

      function (response) {


        renderTable(

          response,

          SWABBING

        );


      };



    window.dewPointResponse =

      function (response) {


        renderTable(

          response,

          DEW_POINT

        );


      };



    /* =========================================================
       LOAD
    ========================================================= */

    function loadAllTables() {


      loadSheet(
        SWABBING
      );


      loadSheet(
        DEW_POINT
      );


    }



    loadAllTables();


    setInterval(

      loadAllTables,

      TABLE_REFRESH_TIME

    );


  </script>


</body>
