  <script>


    /* =========================================================
       REFRESH RATE

       60 SECONDS
    ========================================================= */

    const TABLE_REFRESH_TIME =
      60000;



    /* =========================================================
       GOOGLE SHEETS
    ========================================================= */

    const SWABBING = {

      spreadsheetId:

        "1dPQfygx00SWQLDKmLbK1zyKX5by40ub6xZqm1VAUaDs",

      gid:

        "0",

      range:

      ],

    };



    const DEW_POINT = {

      gid:

        "0",

      range:

        "A:Z",

      container:

        "dewPointContainer",

      callback:

        "dewPointResponse",

      hiddenColumns: [

        "TIMESTAMP"

      ],

      sortByDateTime:

    };



    /* =========================================================
       NORMALIZE TEXT
    ========================================================= */

    function normalizeText(value) {


      return String(
        value || ""
      )

      .trim()

      .toUpperCase();

    }



    /* =========================================================
       CELL HAS VALUE
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );


    }



    /* =========================================================
       DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }


      if (

        cell.f !== undefined

        &&

        cell.f !== null

        &&

        cell.f !== ""

      ) {

        return cell.f;

      }


      if (

        cell.v !== undefined

        &&

        cell.v !== null

      ) {

        return cell.v;

      }


      return "";

    }



    /* =========================================================
       EXTRACT NUMBER
    ========================================================= */

    function extractNumber(value) {


      if (

        value === null

        ||

        value === undefined

        ||

        value === ""

      ) {

        return null;

      }


      if (
        typeof value === "number"
      ) {

        return Number.isFinite(value)
          ? value
          : null;

      }


      const match =

        String(value)

        .replace(
          /,/g,
          ""
        )

        .replace(
          /−/g,
          "-"
        )

        .match(
          /[-+]?\d+(?:\.\d+)?/
        );


      if (!match) {

        return null;

      }


      const number =

        parseFloat(
          match[0]
        );


      return Number.isFinite(
        number
      )

        ? number

        : null;

    }



    /* =========================================================
       COLUMN IDENTIFICATION
    ========================================================= */

    function isTimestampColumn(name) {


      const n =

        normalizeText(
          name
        );


      return (

        n === "TIMESTAMP"

        ||

        n.includes(
          "TIMESTAMP"
        )

      );

    }



    function isDateColumn(name) {


      const n =

        normalizeText(
          name
        );


      return (

        n === "DATE"

        ||

        n.startsWith(
          "DATE "
        )

        ||

        n.endsWith(
          " DATE"
        )

        ||

        n === "TARIKH"

        ||

        n.startsWith(
          "TARIKH "
        )

      );

    }



    function isTimeColumn(name) {


      const n =

        normalizeText(
          name
        );


      if (
        isTimestampColumn(n)
      ) {

        return false;

      }


      return (

        n === "TIME"

        ||

        n.startsWith(
          "TIME "
        )

        ||

        n.endsWith(
          " TIME"
        )

        ||

        n.includes(
          "MASA"
        )

        ||

        n.includes(
          "HRS"
        )

      );

    }



    /* =========================================================
       HIDE COLUMN
    ========================================================= */

    function shouldHideColumn(
      columnLabel,
      config
    ) {


      const name =

        normalizeText(
          columnLabel
        );


      if (
        isTimestampColumn(
          name
        )
      ) {

        return true;

      }


      const hiddenColumns =

        (
          config.hiddenColumns || []
        )

        .map(

          function (item) {

            return normalizeText(
              item
            );

          }

        );


      return hiddenColumns.some(

        function (hiddenName) {


          return (

            name === hiddenName

            ||

            name.includes(
              hiddenName
            )

          );


        }

      );

    }



    /* =========================================================
       PARSE DATE
    ========================================================= */

    function parseDateCell(cell) {


      if (!cell) {

        return null;

      }


      const candidates = [

        cell.f,

        cell.v

      ];


      for (
        const candidate
        of candidates
      ) {


        if (

          candidate === null

          ||

          candidate === undefined

          ||

          candidate === ""

        ) {

          continue;

        }


        const text =

          String(candidate)
          .trim();


        /*
           GOOGLE GVIZ DATE

           Date(2026,8,4)
        */

        let match =

          text.match(

            /Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]),

            Number(match[3]),

            0,
            0,
            0,
            0

          )
          .getTime();

        }



        /*
           DD/MM/YYYY
           DD-MM-YYYY
        */

        match =

          text.match(

            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/

          );


        if (match) {


          return new Date(

            Number(match[3]),

            Number(match[2]) - 1,

            Number(match[1]),

            0,
            0,
            0,
            0

          )
          .getTime();

        }



        /*
           YYYY-MM-DD
        */

        match =

          text.match(

            /^(\d{4})-(\d{1,2})-(\d{1,2})$/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]) - 1,

            Number(match[3]),

            0,
            0,
            0,
            0

          )
          .getTime();

        }



        const parsed =

          Date.parse(
            text
          );


        if (
          Number.isFinite(
            parsed
          )
        ) {


          const date =

            new Date(
              parsed
            );


          return new Date(

            date.getFullYear(),

            date.getMonth(),

            date.getDate(),

            0,
            0,
            0,
            0

          )
          .getTime();

        }


      }


      return null;

    }



    /* =========================================================
       PARSE TIME
    ========================================================= */

    function parseTimeCell(cell) {


      if (!cell) {

        return 0;

      }



      if (

        typeof cell.v === "number"

        &&

        cell.v >= 0

        &&

        cell.v < 1

      ) {


        return Math.round(

          cell.v

          *

          86400000

        );

      }



      const candidates = [

        cell.f,

        cell.v

      ];


      for (
        const candidate
        of candidates
      ) {


        if (

          candidate === null

          ||

          candidate === undefined

          ||

          candidate === ""

        ) {

          continue;

        }


        let text =

          String(candidate)

          .trim()

          .toUpperCase()

          .replace(
            /\./g,
            ":"
          )

          .replace(
            /\s+/g,
            " "
          );



        /*
           GOOGLE GVIZ DATETIME
        */

        let match =

          text.match(

            /DATE\(\s*\d{4}\s*,\s*\d{1,2}\s*,\s*\d{1,2}\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})(?:\s*,\s*(\d{1,2}))?/

          );


        if (match) {


          return (

            Number(match[1]) * 3600000

            +

            Number(match[2]) * 60000

            +

            Number(match[3] || 0) * 1000

          );

        }



        /*
           09:04
           11:05
           11:05:30
        */

        match =

          text.match(

            /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(?:HRS?)?$/

          );


        if (match) {


          const hour =

            Number(
              match[1]
            );


          const minute =

            Number(
              match[2]
            );


          const second =

            Number(
              match[3] || 0
            );


          if (

            hour >= 0

            &&

            hour <= 23

            &&

            minute >= 0

            &&

            minute <= 59

          ) {


            return (

              hour * 3600000

              +

              minute * 60000

              +

              second * 1000

            );

          }


        }



        /*
           0904
           1105
           905
           1105HRS
        */

        match =

          text.match(

            /^(\d{3,4})\s*(?:HRS?)?$/

          );


        if (match) {


          const digits =

            match[1]
            .padStart(
              4,
              "0"
            );


          const hour =

            Number(
              digits.substring(
                0,
                2
              )
            );


          const minute =

            Number(
              digits.substring(
                2,
                4
              )
            );


          if (

            hour >= 0

            &&

            hour <= 23

            &&

            minute >= 0

            &&

            minute <= 59

          ) {


            return (

              hour * 3600000

              +

              minute * 60000

            );

          }


        }



        /*
           AM / PM
        */

        match =

          text.match(

            /^(\d{1,2}):(\d{2})\s*(AM|PM)$/

          );


        if (match) {


          let hour =

            Number(
              match[1]
            );


          const minute =

            Number(
              match[2]
            );


          const period =

            match[3];


          if (

            period === "PM"

            &&

            hour !== 12

          ) {

            hour += 12;

          }


          if (

            period === "AM"

            &&

            hour === 12

          ) {

            hour = 0;

          }


          return (

            hour * 3600000

            +

            minute * 60000

          );

        }


      }


      return 0;

    }



    /* =========================================================
       FIND DATE + TIME COLUMNS
    ========================================================= */

    function findDateTimeColumns(columns) {


      let dateIndex =
        -1;


      let timeIndex =
        -1;


      columns.forEach(

        function (
          column,
          index
        ) {


          const label =

            column.label || "";


          if (

            dateIndex === -1

            &&

            isDateColumn(
              label
            )

          ) {

            dateIndex =
              index;

          }


          if (

            timeIndex === -1

            &&

            isTimeColumn(
              label
            )

          ) {

            timeIndex =
              index;

          }


        }

      );


      return {

        dateIndex:
          dateIndex,

        timeIndex:
          timeIndex

      };

    }



    /* =========================================================
       GET ROW DATE/TIME
    ========================================================= */

    function getRowDateTimeValue(
      row,
      dateIndex,
      timeIndex
    ) {


      if (

        !row

        ||

        !row.c

        ||

        dateIndex < 0

      ) {

        return null;

      }


      const dateValue =

        parseDateCell(

          row.c[
            dateIndex
          ]

        );


      if (
        dateValue === null
      ) {

        return null;

      }


      const timeValue =

        timeIndex >= 0

          ? parseTimeCell(

              row.c[
                timeIndex
              ]

            )

          : 0;


      return (

        dateValue

        +

        timeValue

      );

    }



    /* =========================================================
       SORT ROWS

       OLDEST -> NEWEST

       LATEST DATA ALWAYS AT BOTTOM
    ========================================================= */

    function sortRowsByDateTime(
      rows,
      columns
    ) {


      const indexes =

        findDateTimeColumns(
          columns
        );


      if (
        indexes.dateIndex < 0
      ) {

        return rows;

      }


      const sortable =

        rows.map(

          function (
            row,
            index
          ) {


            return {

              row:
                row,

              originalIndex:
                index,

              dateTime:

                getRowDateTimeValue(

                  row,

                  indexes.dateIndex,

                  indexes.timeIndex

                )

            };


          }

        );


      sortable.sort(

        function (
          a,
          b
        ) {


          const aValid =

            Number.isFinite(
              a.dateTime
            );


          const bValid =

            Number.isFinite(
              b.dateTime
            );


          if (
            !aValid
            &&
            bValid
          ) {

            return -1;

          }


          if (
            aValid
            &&
            !bValid
          ) {

            return 1;

          }


          if (
            !aValid
            &&
            !bValid
          ) {


            return (

              a.originalIndex

              -

              b.originalIndex

            );

          }


          if (
            a.dateTime !== b.dateTime
          ) {


            return (

              a.dateTime

              -

              b.dateTime

            );

          }


          return (

            a.originalIndex

            -

            b.originalIndex

          );


        }

      );


      return sortable.map(

        function (item) {

          return item.row;

        }

      );

    }



    /* =========================================================
       FIND VISIBLE COLUMNS
    ========================================================= */

    function getVisibleColumns(
      columns,
      rows,
      config
    ) {


      const visibleColumns =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          const name =

            normalizeText(
              column.label
            );


          if (

            shouldHideColumn(
              name,
              config
            )

          ) {

            return;

          }


          const hasData =

            rows.some(

              function (row) {


                return (

                  row.c

                  &&

                  cellHasValue(

                    row.c[
                      index
                    ]

                  )

                );


              }

            );


          if (

            name !== ""

            ||

            hasData

          ) {


            visibleColumns.push({

              column:
                column,

              index:
                index

            });


          }


        }

      );


      return visibleColumns;

    }



    /* =========================================================
       FILTER EMPTY ROWS
    ========================================================= */

    function getNonEmptyRows(
      rows,
      visibleColumns
    ) {


      return rows.filter(

        function (row) {


          return visibleColumns.some(

            function (item) {


              return (

                row.c

                &&

                cellHasValue(

                  row.c[
                    item.index
                  ]

                )

              );


            }

          );


        }

      );

    }



    /* =========================================================
       FIND LOWEST VALUES

       EACH DEW POINT LOCATION COLUMN
       IS CALCULATED SEPARATELY
    ========================================================= */

    function findLowestValues(
      rows,
      visibleColumns
    ) {


      const lowestValues =

        new Map();


      visibleColumns.forEach(

        function (item) {


          const columnName =

            item.column.label || "";


          /*
             DO NOT CALCULATE LOWEST FOR
             DATE OR TIME COLUMNS
          */

          if (

            isDateColumn(
              columnName
            )

            ||

            isTimeColumn(
              columnName
            )

            ||

            isTimestampColumn(
              columnName
            )

          ) {

            return;

          }


          let minimum =
            null;


          rows.forEach(

            function (row) {


              const cell =

                row.c

                  ? row.c[
                      item.index
                    ]

                  : null;


              const value =

                extractNumber(

                  getCellDisplayValue(
                    cell
                  )

                );


              if (
                value === null
              ) {

                return;

              }


              if (

                minimum === null

                ||

                value < minimum

              ) {

                minimum =
                  value;

              }


            }

          );


          if (
            minimum !== null
          ) {


            lowestValues.set(

              item.index,

              minimum

            );


          }


        }

      );


      return lowestValues;

    }



    /* =========================================================
       LOAD GOOGLE SHEET

       IMPORTANT:

       SELECT *

       NOT:

       WHERE A IS NOT NULL

       THIS ALLOWS MANUAL DATA WITH NO FORM TIMESTAMP.
    ========================================================= */

    function loadSheet(config) {


      const query =

        "select *";


      const tqx =

        `out:json;responseHandler:${config.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        config.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        config.gid

        +

        "&range="

        +

        encodeURIComponent(
          config.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();



      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;


      script.onerror =

        function () {


          const container =

            document.getElementById(
              config.container
            );


          if (container) {


            container.innerHTML =

              '<div class="message">' +

              'Unable to Load Google Sheet Data' +

              '<br>' +

              'Check Google Sheet Sharing Permission' +

              '</div>';


          }


        };


      script.onload =

        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {

                script.remove();

              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );

    }



    /* =========================================================
       SCROLL TO LATEST
    ========================================================= */

    function scrollTableToBottom(container) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );

    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =

        document.getElementById(
          config.container
        );


      if (

        !response

        ||

        !response.table

      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Data Available' +

          '</div>';


        return;

      }



      const columns =

        response.table.cols || [];


      const originalRows =

        response.table.rows || [];



      /* =======================================================
         VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns =

        getVisibleColumns(

          columns,

          originalRows,

          config

        );


      if (
        visibleColumns.length === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Data Available' +

          '</div>';


        return;

      }



      /* =======================================================
         REMOVE EMPTY ROWS
      ======================================================= */

      let rows =

        getNonEmptyRows(

          originalRows,

          visibleColumns

        );


      if (
        rows.length === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Readings Available' +

          '</div>';


        return;

      }



      /* =======================================================
         SORT BY USER KEYED DATE + TIME

         NOT FORM TIMESTAMP
      ======================================================= */

      if (
        config.sortByDateTime
      ) {


        rows =

          sortRowsByDateTime(

            rows,

            columns

          );


      }



      /* =======================================================
         LOWEST VALUE
      ======================================================= */

      const lowestValues =

        config.highlightLowest

          ? findLowestValues(

              rows,

              visibleColumns

            )

          : new Map();



      /* =======================================================
         CREATE TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );


      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );



      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            item.column.label || "";


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         BODY
      ======================================================= */

      const tbody =

        document.createElement(
          "tbody"
        );


      rows.forEach(

        function (row) {


          const tr =

            document.createElement(
              "tr"
            );


          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                  ? row.c[
                      item.index
                    ]

                  : null;


              const displayValue =

                getCellDisplayValue(
                  cell
                );


              td.textContent =
                displayValue;



              /* =================================================
                 LOWEST VALUE = BOLD
              ================================================= */

              if (

                config.highlightLowest

                &&

                lowestValues.has(
                  item.index
                )

              ) {


                const number =

                  extractNumber(
                    displayValue
                  );


                const minimum =

                  lowestValues.get(
                    item.index
                  );


                if (

                  number !== null

                  &&

                  Math.abs(

                    number - minimum

                  )

                  < 0.000001

                ) {


                  td.classList.add(
                    "lowest-value"
                  );


                }


              }


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


        }

      );


      table.appendChild(
        tbody
      );


      container.innerHTML =
        "";


      container.appendChild(
        table
      );


      /*
         SHOW LATEST DATA
      */

      scrollTableToBottom(
        container
      );

    }



    /* =========================================================
       GOOGLE CALLBACKS
    ========================================================= */

    window.swabbingResponse =

      function (response) {


        renderTable(

          response,

          SWABBING

        );


      };



    window.dewPointResponse =

      function (response) {


        renderTable(

          response,

          DEW_POINT

        );


      };



    /* =========================================================
       LOAD ALL
    ========================================================= */

    function loadAllTables() {


      loadSheet(
        SWABBING
      );


      loadSheet(
        DEW_POINT
      );


    }



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadAllTables();



    /* =========================================================
       AUTO REFRESH
    ========================================================= */

    setInterval(

      loadAllTables,

      TABLE_REFRESH_TIME

    );


  </script>
