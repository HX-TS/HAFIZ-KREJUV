<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>FEC Swabbing Data</title>


  <!-- =========================================================
       FAVICON
  ========================================================= -->

  <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >

  <link
    rel="apple-touch-icon"
    href="https://i.ibb.co/gbgLwSqg/Chat-GPT-Image-Jul-26-2026-04-53-23-AM-2.png"
  >


  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {

      --black: #050505;

      --cream: #f2efe9;

      --cream-2: #ebe8e2;

      --line: #cbc7bf;

      --grey: #5b5751;

      --date-1: #f2efe9;

      --date-2: #dfe8e2;

      --date-3: #eee3d4;

      --date-4: #dde5ed;

      --date-5: #eadfe6;

      --date-6: #e3e8d7;

    }


    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html {

      width: 100%;

      min-height: 100%;

      -webkit-text-size-adjust: 100%;

      text-size-adjust: 100%;

      background:
        var(--black);

    }


    body {

      width: 100%;

      min-height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--black);

      color:
        var(--black);

      overflow: hidden;

    }


    a {

      -webkit-tap-highlight-color:
        transparent;

    }



    /* =========================================================
       PAGE
    ========================================================= */

    .page {

      width: 100%;

      height: 100dvh;

      min-height: 100dvh;

      display: flex;

      flex-direction: column;

      gap: 7px;

      padding: 7px;

      background:
        var(--black);

    }



    /* =========================================================
       HEADER
    ========================================================= */

    .hero {

      flex-shrink: 0;

      min-height: 118px;

      height: 118px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(330px, 390px)
        minmax(190px, 220px);

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }



    /* =========================================================
       HEADER TITLE
    ========================================================= */

    .hero-left {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        18px
        28px;

    }


    .hero-title {

      font-size:
        clamp(
          36px,
          4vw,
          64px
        );

      font-weight: 900;

      line-height: 0.90;

      letter-spacing: -0.05em;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .hero-subtitle {

      margin-top: 10px;

      color:
        var(--grey);

      font-size:
        clamp(
          9px,
          0.7vw,
          12px
        );

      font-weight: 900;

      letter-spacing: 0.30em;

      text-transform: uppercase;

    }



    /* =========================================================
       CURRENT DATE / TIME / SHIFT
    ========================================================= */

    .current-status {

      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      padding:
        18px
        22px;

      border-left:
        1px solid
        var(--black);

      background:
        var(--cream);

    }


    .current-datetime {

      font-size:
        clamp(
          19px,
          1.5vw,
          25px
        );

      line-height: 1;

      font-weight: 900;

      letter-spacing: 0.01em;

      white-space: nowrap;

      font-variant-numeric:
        tabular-nums;

    }


    .current-shift {

      margin-top: 12px;

      color:
        var(--grey);

      font-size:
        clamp(
          11px,
          0.8vw,
          14px
        );

      line-height: 1.25;

      font-weight: 900;

      letter-spacing: 0.025em;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .current-shift strong {

      color:
        var(--black);

      font-weight: 900;

    }



    /* =========================================================
       MAIN BOOKMARK
    ========================================================= */

    .main-bookmark {

      min-width: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      padding:
        16px
        20px;

      border-left:
        1px solid
        var(--black);

      background:
        var(--cream);

      color:
        var(--black);

      text-decoration: none;

      text-align: center;

      font-size:
        clamp(
          12px,
          0.95vw,
          15px
        );

      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 0.04em;

      text-transform: uppercase;

      transition:
        background 0.15s ease,
        color 0.15s ease;

    }


    .main-bookmark:hover,
    .main-bookmark:focus-visible {

      background:
        var(--black);

      color:
        #ffffff;

      outline: none;

    }


    .bookmark-arrow {

      font-size: 21px;

      line-height: 1;

      font-weight: 900;

    }



    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard {

      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 7px;

    }



    /* =========================================================
       PANEL
    ========================================================= */

    .reading-panel {

      min-height: 0;

      display: flex;

      flex-direction: column;

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      overflow: hidden;

    }


    .panel-title {

      flex-shrink: 0;

      min-height: 50px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 14px;

      padding:
        0
        18px;

      background:
        var(--cream);

      border-bottom:
        1px solid
        var(--line);

      font-size:
        clamp(
          14px,
          1vw,
          17px
        );

      font-weight: 900;

      letter-spacing: 0.035em;

      text-transform: uppercase;

    }


    .panel-note {

      flex-shrink: 0;

      color:
        var(--grey);

      font-size:
        clamp(
          8px,
          0.6vw,
          11px
        );

      line-height: 1.2;

      font-weight: 900;

      letter-spacing: 0.055em;

      text-align: right;

      text-transform: uppercase;

    }



    /* =========================================================
       TABLE WRAPPER
    ========================================================= */

    .table-wrapper {

      position: relative;

      flex: 1;

      min-height: 0;

      overflow-x: auto;

      overflow-y: auto;

      background:
        var(--cream);

      overscroll-behavior:
        contain;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width: thin;

      scrollbar-color:
        #777
        var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar {

      width: 9px;

      height: 9px;

    }


    .table-wrapper::-webkit-scrollbar-track {

      background:
        var(--cream-2);

    }


    .table-wrapper::-webkit-scrollbar-thumb {

      background:
        #777;

    }



    /* =========================================================
       TABLE
    ========================================================= */

    table {

      width: 100%;

      min-width: max-content;

      border-collapse: collapse;

      table-layout: auto;

      background:
        var(--cream);

    }


    thead {

      position: sticky;

      top: 0;

      z-index: 30;

    }


    th {

      min-width: 145px;

      height: 57px;

      padding:
        10px
        15px;

      background:
        var(--cream);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        2px solid
        var(--black);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size:
        clamp(
          12px,
          0.9vw,
          15px
        );

      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 0.015em;

      text-transform: uppercase;

    }


    td {

      min-width: 145px;

      height: 45px;

      padding:
        9px
        15px;

      background:
        var(--cream);

      border-right:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);

      text-align: center;

      vertical-align: middle;

      white-space: nowrap;

      font-size:
        clamp(
          13px,
          0.95vw,
          16px
        );

      line-height: 1.15;

      font-weight: 600;

      font-variant-numeric:
        tabular-nums;

    }


    th:last-child,
    td:last-child {

      border-right: none;

    }



    /* =========================================================
       DEW POINT DATE GROUP COLOURS
    ========================================================= */

    #dewPointContainer
    tbody
    tr.date-group-0
    td {

      background:
        var(--date-1);

    }


    #dewPointContainer
    tbody
    tr.date-group-1
    td {

      background:
        var(--date-2);

    }


    #dewPointContainer
    tbody
    tr.date-group-2
    td {

      background:
        var(--date-3);

    }


    #dewPointContainer
    tbody
    tr.date-group-3
    td {

      background:
        var(--date-4);

    }


    #dewPointContainer
    tbody
    tr.date-group-4
    td {

      background:
        var(--date-5);

    }


    #dewPointContainer
    tbody
    tr.date-group-5
    td {

      background:
        var(--date-6);

    }



    /* =========================================================
       NEW DATE SEPARATOR
    ========================================================= */

    #dewPointContainer
    tbody
    tr.new-date-group
    td {

      border-top:
        3px solid
        var(--black);

    }



    /* =========================================================
       LATEST DATE

       ALL DATA ON LATEST DATE = BOLD
    ========================================================= */

    #dewPointContainer
    tbody
    tr.latest-date
    td {

      font-weight: 900;

    }



    /* =========================================================
       LOWEST READING
    ========================================================= */

    td.lowest-value {

      font-weight: 900 !important;

      text-decoration:
        underline;

      text-decoration-thickness:
        2px;

      text-underline-offset:
        4px;

    }



    /* =========================================================
       HOVER
    ========================================================= */

    @media (hover: hover) {

      tbody tr:hover td {

        filter:
          brightness(0.94);

      }

    }



    /* =========================================================
       MESSAGE
    ========================================================= */

    .message {

      width: 100%;

      height: 100%;

      min-height: 100px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      text-align: center;

      font-size:
        clamp(
          12px,
          1vw,
          16px
        );

      line-height: 1.5;

      font-weight: 900;

      text-transform: uppercase;

    }



    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      flex-shrink: 0;

      min-height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        7px
        10px
        max(
          7px,
          env(safe-area-inset-bottom)
        );

      background:
        var(--cream);

      border:
        1px solid
        var(--black);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 0.09em;

      text-transform: uppercase;

    }



    /* =========================================================
       MEDIUM DESKTOP / SMALL LAPTOP
    ========================================================= */

    @media (max-width: 1250px) {

      .hero {

        grid-template-columns:
          minmax(0, 1fr)
          290px
          165px;

      }


      .hero-left {

        padding:
          15px
          20px;

      }


      .hero-title {

        font-size:
          clamp(
            31px,
            3.8vw,

          );

      }


      .current-status {

          16px;

      }


      .current-datetime {

      }

        margin-top: 9px;

      }


      .main-bookmark {

        padding:
          12px

        font-size: 11px;

      }


      th {

        min-width: 130px;

        font-size: 12px;

      }


      td {

        min-width: 130px;

        font-size: 13px;

      }

    }



    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 900px) {

      .hero {

        min-height: 105px;

        height: 105px;

        grid-template-columns:
          minmax(0, 1fr)
          250px
          135px;

      }


      .hero-title {

        font-size:
          clamp(
            27px,
            4.3vw,
            40px
          );

      }


      .current-datetime {

        font-size: 15px;

      }


      .current-shift {

        font-size: 8.5px;

      }


      .main-bookmark {

        font-size: 9px;

      }


      .panel-title {

        min-height: 45px;

        font-size: 13px;

      }


      th {

        min-width: 120px;

        height: 50px;

        padding:
          8px
          10px;

        font-size: 11px;

      }


      td {

        min-width: 120px;

        height: 40px;

        padding:
          7px
          10px;

        font-size: 12px;

      }

    }



    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      body {

        overflow: hidden;

      }


      .page {

        gap: 3px;

        padding:
          max(
            3px,
            env(safe-area-inset-top)
          )
          3px
          max(
            3px,
            env(safe-area-inset-bottom)
          );

      }



      /* =======================================================
         MOBILE HEADER
      ======================================================= */

      .hero {

        min-height: 138px;

        height: 138px;

        grid-template-columns:
          minmax(0, 1fr)
          112px;

        grid-template-rows:
          74px
          64px;

      }


      .hero-left {

        grid-column:
          1 / -1;

        grid-row:
          1;

        justify-content: center;

        padding:
          9px
          12px;

        border-bottom:
          1px solid
          var(--black);

      }


      .hero-title {

        font-size:
          clamp(
            26px,
            7.6vw,
            36px
          );

        line-height: 0.92;

        white-space: normal;

      }


      .hero-subtitle {

        margin-top: 5px;

        font-size: 7px;

        letter-spacing: 0.24em;

      }



      /* =======================================================
         MOBILE TIME
      ======================================================= */

      .current-status {

        grid-column:
          1;

        grid-row:
          2;

        justify-content: center;

        padding:
          8px
          11px;

        border-left: none;

      }


      .current-datetime {

        font-size:
          clamp(
            14px,
            4vw,
            18px

        line-height: 1;

      }


      .current-shift {

        font-size:
          clamp(
            7.5px,
            2.4vw,
            10px
          );

      }



      /* =======================================================
         MOBILE BOOKMARK
      ======================================================= */

      .main-bookmark {

        grid-column:
          2;

        grid-row:
          2;

        min-height: 64px;

        padding:
          7px
          8px;

        font-size:
          clamp(
            8px,
            2.5vw,
            10px

        line-height: 1.2;

      }


      .bookmark-arrow {

      }



      /* =======================================================
         MOBILE PANELS
      ======================================================= */

      .dashboard {

        gap: 3px;

      }


      .panel-title {

        min-height: 40px;

        padding:
          0
          9px;

        gap: 6px;

        font-size:
          clamp(
            11px,
            3.3vw,
            14px
          );

      }


      .panel-note {

        max-width: 47%;

        font-size:
          clamp(
            6px,
            1.8vw,
            8px
          );

        white-space: normal;

      }



      /* =======================================================
         MOBILE TABLE

         DON'T COMPRESS.
         USER CAN SWIPE LEFT / RIGHT.
      ======================================================= */

      th {

        min-width: 118px;

        height: 49px;

        padding:
          8px
          9px;

        font-size:
          clamp(
            10px,
            3vw,
            12px
          );

      }


      td {

        min-width: 118px;

        height: 40px;

        padding:
          7px
          9px;

        font-size:
          clamp(
            11px,

      }


      .footer {

      }

    }



    /* =========================================================
       VERY SMALL PHONE
    ========================================================= */

    @media (max-width: 390px) {

      .hero {

        grid-template-columns:
          minmax(0, 1fr)
          100px;

      }


      .hero-title {

        font-size:
          clamp(
            24px,
            7.3vw,
            30px
          );

      }


      .current-status {

        padding:
          7px
          8px;

      }

<body>


  <div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="hero">


      <!-- ===================================================
           TITLE
      ==================================================== -->

      <div class="hero-left">


        <div class="hero-title">

          FEC SWABBING DATA

        </div>


        <div class="hero-subtitle">

          TECHSMITH

        </div>


      </div>



      <!-- ===================================================
           CURRENT TIME / SHIFT
      ==================================================== -->

      <div class="current-status">


        <div
          class="current-datetime"
          id="currentDateTime"
        >

          -- --- ---- --:--:--

        </div>


        <div
          class="current-shift"
          id="currentShift"
        >

          CURRENT SHIFT: --

        </div>


      </div>



      <!-- ===================================================
           MAIN BOOKMARK
      ==================================================== -->

      <a
        class="main-bookmark"
        href="https://hx-ts.github.io/HAFIZ-KREJUV/"
      >

        MAIN BOOKMARK

        <span class="bookmark-arrow">

          ↗

        </span>

      </a>


    </header>



    <!-- =====================================================
         DATA
    ====================================================== -->

    <main class="dashboard">


      <!-- ===================================================
           SWABBING PIG RUN
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">


          <div>

            SWABBING PIG RUN

          </div>


          <div class="panel-note">

            LATEST DATA AT BOTTOM

          </div>


        </div>


        <div
          class="table-wrapper"
          id="swabbingContainer"
        >


          <div class="message">

            Loading Swabbing Pig Run Data...

          </div>


        </div>


      </section>



      <!-- ===================================================
           DEW POINT DATA
      ==================================================== -->

      <section class="reading-panel">


        <div class="panel-title">


          <div>

            DEW POINT DATA

          </div>


          <div class="panel-note">

            DATE GROUPED · LATEST DATE BOLD · LOWEST UNDERLINED

          </div>


        </div>


        <div
          class="table-wrapper"
          id="dewPointContainer"
        >


          <div class="message">

            Loading Dew Point Data...

          </div>


        </div>


      </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

      Fly TechSmith

    </footer>


  </div>



  <script>


    /* =========================================================
       SETTINGS
    ========================================================= */

    /*
       GOOGLE SHEETS AUTO REFRESH

       60000 MS = 60 SECONDS
    */

    const TABLE_REFRESH_TIME =
      60000;


    /*
       HEADER CLOCK UPDATE

       1000 MS = 1 SECOND
    */

    const CLOCK_REFRESH_TIME =
      1000;


    const MALAYSIA_TIME_ZONE =
      "Asia/Kuala_Lumpur";


    const DATE_GROUP_COLOUR_COUNT =
      6;



    /* =========================================================
       GOOGLE SHEETS
    ========================================================= */

    const SWABBING = {


      spreadsheetId:

        "1dPQfygx00SWQLDKmLbK1zyKX5by40ub6xZqm1VAUaDs",


      gid:

        "0",


      range:

        "A:Z",


      container:

        "swabbingContainer",


      callback:

        "swabbingResponse",


      hiddenColumns: [

        "TIMESTAMP"

      ],


      sortByDateTime:

        true,


      highlightLowest:

        false,


      groupByDate:

        false


    };



    const DEW_POINT = {


      spreadsheetId:

        "1vdrb81qWoamvrjqI-t6nSOUjYlK1ldnMxKduUAZxTWM",


      gid:

        "0",


      range:

        "A:Z",


      container:

        "dewPointContainer",


      callback:

        "dewPointResponse",


      hiddenColumns: [

        "TIMESTAMP"

      ],


      sortByDateTime:

        true,


      highlightLowest:

        true,


      groupByDate:

        true


    };



    /* =========================================================
       MALAYSIA DATE / TIME
    ========================================================= */

    function getMalaysiaParts() {


      const formatter =

        new Intl.DateTimeFormat(

          "en-GB",

          {

            timeZone:
              MALAYSIA_TIME_ZONE,

            year:
              "numeric",

            month:
              "short",

            day:
              "2-digit",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hourCycle:
              "h23"

          }

        );


      const parts =

        formatter.formatToParts(
          new Date()
        );


      const result =
        {};


      parts.forEach(

        function (part) {


          if (
            part.type !== "literal"
          ) {


            result[
              part.type
            ] =
              part.value;


          }


        }

      );


      return result;

    }



    /* =========================================================
       UPDATE CURRENT TIME / SHIFT
    ========================================================= */

    function updateCurrentTime() {


      const parts =
        getMalaysiaParts();


      const month =

        String(
          parts.month || ""
        )
        .toUpperCase();


      const dateText =

        parts.day

        +

        " "

        +

        month

        +

        " "

        +

        parts.year

        +

        " "

        +

        parts.hour

        +

        ":"

        +

        parts.minute

        +

        ":"

        +

        parts.second;


      const dateTimeElement =

        document.getElementById(
          "currentDateTime"
        );


      dateTimeElement.textContent =
        dateText;



      /* =======================================================
         SHIFT

         DAY:
         07:00 - 18:59

         NIGHT:
         19:00 - 06:59
      ======================================================= */

      const hour =

        Number(
          parts.hour
        );


      const isDayShift =

        hour >= 7

        &&

        hour <= 18;


      const shiftElement =

        document.getElementById(
          "currentShift"
        );


      if (isDayShift) {


        shiftElement.innerHTML =

          "CURRENT SHIFT: " +

          "<strong>DAY</strong>" +

          " · 07:00 - 18:59";


      }


      else {


        shiftElement.innerHTML =

          "CURRENT SHIFT: " +

          "<strong>NIGHT</strong>" +

          " · 19:00 - 06:59";


      }


    }



    /* =========================================================
       START CLOCK
    ========================================================= */

    updateCurrentTime();


    setInterval(

      updateCurrentTime,

      CLOCK_REFRESH_TIME

    );



    /* =========================================================
       NORMALIZE TEXT
    ========================================================= */

    function normalizeText(value) {


      return String(
        value || ""
      )

      .trim()

      .toUpperCase();

    }



    /* =========================================================
       CELL HAS VALUE
    ========================================================= */

    function cellHasValue(cell) {


      if (!cell) {

        return false;

      }


      return !(

        cell.v === null

        ||

        cell.v === undefined

        ||

        cell.v === ""

      );

    }



    /* =========================================================
       GET CELL DISPLAY VALUE
    ========================================================= */

    function getCellDisplayValue(cell) {


      if (!cell) {

        return "";

      }


      if (

        cell.f !== undefined

        &&

        cell.f !== null

        &&

        cell.f !== ""

      ) {


        return cell.f;


      }


      if (

        cell.v !== undefined

        &&

        cell.v !== null

      ) {


        return cell.v;


      }


      return "";

    }



    /* =========================================================
       EXTRACT NUMBER
    ========================================================= */

    function extractNumber(value) {


      if (

        value === null

        ||

        value === undefined

        ||

        value === ""

      ) {


        return null;


      }


      if (
        typeof value === "number"
      ) {


        return Number.isFinite(
          value
        )

          ? value

          : null;


      }


      const match =

        String(value)

        .replace(
          /,/g,
          ""
        )

        .replace(
          /−/g,
          "-"
        )

        .match(
          /[-+]?\d+(?:\.\d+)?/
        );


      if (!match) {

        return null;

      }


      const number =

        parseFloat(
          match[0]
        );


      return Number.isFinite(
        number
      )

        ? number

        : null;

    }



    /* =========================================================
       COLUMN TYPE
    ========================================================= */

    function isTimestampColumn(name) {


      const n =

        normalizeText(
          name
        );


      return n.includes(
        "TIMESTAMP"
      );

    }



    function isDateColumn(name) {


      const n =

        normalizeText(
          name
        );


      return (

        n === "DATE"

        ||

        n === "TARIKH"

        ||

        n.startsWith(
          "DATE "
        )

        ||

        n.startsWith(
          "TARIKH "
        )

        ||

        n.endsWith(
          " DATE"
        )

      );

    }



    function isTimeColumn(name) {


      const n =

        normalizeText(
          name
        );


      if (
        isTimestampColumn(n)
      ) {

        return false;

      }


      return (

        n === "TIME"

        ||

        n === "SAMPLING TIME"

        ||

        n.includes(
          "MASA"
        )

        ||

        n.includes(
          "HRS"
        )

        ||

        n.startsWith(
          "TIME "
        )

        ||

        n.endsWith(
          " TIME"
        )

      );

    }



    /* =========================================================
       CHANGE GOOGLE SHEET HEADER DISPLAY

       MASA AMBIL GAMBARAJAH
       ->
       SAMPLING TIME
    ========================================================= */

    function getDisplayHeaderName(name) {


      const normalized =

        normalizeText(
          name
        );


      if (

        normalized ===
        "MASA AMBIL GAMBARAJAH"

      ) {


        return "SAMPLING TIME";


      }


      return name || "";

    }



    /* =========================================================
       HIDDEN COLUMN
    ========================================================= */

    function shouldHideColumn(
      label,
      config
    ) {


      const name =

        normalizeText(
          label
        );


      if (
        isTimestampColumn(
          name
        )
      ) {

        return true;

      }


      return (

        config.hiddenColumns || []

      )

      .map(
        normalizeText
      )

      .some(

        function (hidden) {


          return (

            name === hidden

            ||

            name.includes(
              hidden
            )

          );


        }

      );

    }



    /* =========================================================
       PARSE DATE
    ========================================================= */

    function parseDateCell(cell) {


      if (!cell) {

        return null;

      }


      if (
        cell.v instanceof Date
      ) {


        return new Date(

          cell.v.getFullYear(),

          cell.v.getMonth(),

          cell.v.getDate()

        )
        .getTime();


      }


      const candidates = [

        cell.f,

        cell.v

      ];


      for (
        const candidate
        of candidates
      ) {


        if (

          candidate === null

          ||

          candidate === undefined

          ||

          candidate === ""

        ) {

          continue;

        }


        const text =

          String(candidate)
          .trim();



        /* =====================================================
           GOOGLE GVIZ DATE

           Date(2026,8,4)

           MONTH STARTS AT ZERO
        ===================================================== */

        let match =

          text.match(

            /Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]),

            Number(match[3])

          )
          .getTime();


        }



        /* =====================================================
           DD/MM/YYYY
           DD-MM-YYYY
        ===================================================== */

        match =

          text.match(

            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/

          );


        if (match) {


          return new Date(

            Number(match[3]),

            Number(match[2]) - 1,

            Number(match[1])

          )
          .getTime();


        }



        /* =====================================================
           YYYY-MM-DD
        ===================================================== */

        match =

          text.match(

            /^(\d{4})-(\d{1,2})-(\d{1,2})$/

          );


        if (match) {


          return new Date(

            Number(match[1]),

            Number(match[2]) - 1,

            Number(match[3])

          )
          .getTime();


        }



        /* =====================================================
           FALLBACK
        ===================================================== */

        const parsed =

          Date.parse(
            text
          );


        if (
          Number.isFinite(
            parsed
          )
        ) {


          const date =

            new Date(
              parsed
            );


          return new Date(

            date.getFullYear(),

            date.getMonth(),

            date.getDate()

          )
          .getTime();


        }


      }


      return null;

    }



    /* =========================================================
       PARSE TIME
    ========================================================= */

    function parseTimeCell(cell) {


      if (!cell) {

        return 0;

      }


      if (
        cell.v instanceof Date
      ) {


        return (

          cell.v.getHours()

          *

          3600000

          +

          cell.v.getMinutes()

          *

          60000

          +

          cell.v.getSeconds()

          *

          1000

        );


      }



      /* =======================================================
         GOOGLE SHEET TIME FRACTION
      ======================================================= */

      if (

        typeof cell.v === "number"

        &&

        cell.v >= 0

        &&

        cell.v < 1

      ) {


        return Math.round(

          cell.v

          *

          86400000

        );


      }



      const value =

        String(

          cell.f !== undefined

          ?

          cell.f

          :

          cell.v || ""

        )

        .trim()

        .toUpperCase()

        .replace(
          /\./g,
          ":"
        );



      /* =======================================================
         09:04
         11:05
         11:05:30
      ======================================================= */

      let match =

        value.match(

          /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(?:HRS?)?$/

        );


      if (match) {


        return (

          Number(match[1])

          *

          3600000

          +

          Number(match[2])

          *

          60000

          +

          Number(match[3] || 0)

          *

          1000

        );


      }



      /* =======================================================
         0904
         1105
         905
         1105HRS
      ======================================================= */

      match =

        value.match(

          /^(\d{3,4})\s*(?:HRS?)?$/

        );


      if (match) {


        const digits =

          match[1]
          .padStart(
            4,
            "0"
          );


        return (

          Number(

            digits.slice(
              0,
              2
            )

          )

          *

          3600000

          +

          Number(

            digits.slice(
              2,
              4
            )

          )

          *

          60000

        );


      }


      return 0;

    }



    /* =========================================================
       FIND DATE / TIME COLUMNS
    ========================================================= */

    function findDateTimeColumns(columns) {


      let dateIndex =
        -1;


      let timeIndex =
        -1;


      columns.forEach(

        function (
          column,
          index
        ) {


          const label =

            column.label || "";


          if (

            dateIndex === -1

            &&

            isDateColumn(
              label
            )

          ) {


            dateIndex =
              index;


          }


          if (

            timeIndex === -1

            &&

            isTimeColumn(
              label
            )

          ) {


            timeIndex =
              index;


          }


        }

      );


      return {

        dateIndex,

        timeIndex

      };

    }



    /* =========================================================
       GET DATE ONLY
    ========================================================= */

    function getRowDateValue(
      row,
      dateIndex
    ) {


      if (

        dateIndex < 0

        ||

        !row.c

      ) {


        return null;


      }


      return parseDateCell(

        row.c[
          dateIndex
        ]

      );

    }



    /* =========================================================
       GET DATE + TIME
    ========================================================= */

    function getRowDateTimeValue(
      row,
      dateIndex,
      timeIndex
    ) {


      const dateValue =

        getRowDateValue(
          row,
          dateIndex
        );


      if (
        dateValue === null
      ) {


        return null;


      }


      const timeValue =

        timeIndex >= 0

          ?

          parseTimeCell(

            row.c[
              timeIndex
            ]

          )

          :

          0;


      return (

        dateValue

        +

        timeValue

      );

    }



    /* =========================================================
       SORT

       OLDEST
       ↓
       NEWEST
    ========================================================= */

    function sortRowsByDateTime(
      rows,
      columns
    ) {


      const indexes =

        findDateTimeColumns(
          columns
        );


      if (
        indexes.dateIndex < 0
      ) {


        return rows;


      }


      return rows

      .map(

        function (
          row,
          index
        ) {


          return {

            row,

            index,

            dateTime:

              getRowDateTimeValue(

                row,

                indexes.dateIndex,

                indexes.timeIndex

              )

          };


        }

      )

      .sort(

        function (
          a,
          b
        ) {


          const aValid =

            Number.isFinite(
              a.dateTime
            );


          const bValid =

            Number.isFinite(
              b.dateTime
            );


          if (
            !aValid && bValid
          ) {


            return -1;


          }


          if (
            aValid && !bValid
          ) {


            return 1;


          }


          if (
            !aValid && !bValid
          ) {


            return (

              a.index

              -

              b.index

            );


          }


          if (
            a.dateTime !== b.dateTime
          ) {


            return (

              a.dateTime

              -

              b.dateTime

            );


          }


          return (

            a.index

            -

            b.index

          );


        }

      )

      .map(

        function (item) {


          return item.row;


        }

      );

    }



    /* =========================================================
       VISIBLE COLUMNS
    ========================================================= */

    function getVisibleColumns(
      columns,
      rows,
      config
    ) {


      const visible =
        [];


      columns.forEach(

        function (
          column,
          index
        ) {


          if (

            shouldHideColumn(

              column.label,

              config

            )

          ) {


            return;


          }


          const hasData =

            rows.some(

              function (row) {


                return (

                  row.c

                  &&

                  cellHasValue(

                    row.c[
                      index
                    ]

                  )

                );


              }

            );


          if (

            normalizeText(
              column.label
            ) !== ""

            ||

            hasData

          ) {


            visible.push({

              column,

              index

            });


          }


        }

      );


      return visible;

    }



    /* =========================================================
       REMOVE EMPTY ROW
    ========================================================= */

    function getNonEmptyRows(
      rows,
      visibleColumns
    ) {


      return rows.filter(

        function (row) {


          return visibleColumns.some(

            function (item) {


              return (

                row.c

                &&

                cellHasValue(

                  row.c[
                    item.index
                  ]

                )

              );


            }

          );


        }

      );

    }



    /* =========================================================
       LOWEST VALUES
    ========================================================= */

    function findLowestValues(
      rows,
      visibleColumns
    ) {


      const result =
        new Map();


      visibleColumns.forEach(

        function (item) {


          const label =

            item.column.label || "";


          if (

            isDateColumn(
              label
            )

            ||

            isTimeColumn(
              label
            )

            ||

            isTimestampColumn(
              label
            )

          ) {


            return;


          }


          let minimum =
            null;


          rows.forEach(

            function (row) {


              const cell =

                row.c

                ?

                row.c[
                  item.index
                ]

                :

                null;


              const number =

                extractNumber(

                  getCellDisplayValue(
                    cell
                  )

                );


              if (
                number === null
              ) {


                return;


              }


              if (

                minimum === null

                ||

                number < minimum

              ) {


                minimum =
                  number;


              }


            }

          );


          if (
            minimum !== null
          ) {


            result.set(

              item.index,

              minimum

            );


          }


        }

      );


      return result;

    }



    /* =========================================================
       LOAD GOOGLE SHEET
    ========================================================= */

    function loadSheet(config) {


      /*
         SELECT *

         THIS IS IMPORTANT.

         DO NOT USE:

         WHERE A IS NOT NULL

         BECAUSE MANUAL DATA MAY HAVE
         NO GOOGLE FORM TIMESTAMP.
      */

      const query =
        "select *";


      const tqx =

        `out:json;responseHandler:${config.callback}`;


      const url =

        "https://docs.google.com/spreadsheets/d/"

        +

        config.spreadsheetId

        +

        "/gviz/tq"

        +

        "?gid="

        +

        config.gid

        +

        "&range="

        +

        encodeURIComponent(
          config.range
        )

        +

        "&headers=1"

        +

        "&tqx="

        +

        encodeURIComponent(
          tqx
        )

        +

        "&tq="

        +

        encodeURIComponent(
          query
        )

        +

        "&_="

        +

        Date.now();



      const oldScript =

        document.querySelector(

          'script[data-sheet-callback="' +

          config.callback +

          '"]'

        );


      if (oldScript) {


        oldScript.remove();


      }



      const script =

        document.createElement(
          "script"
        );


      script.src =
        url;


      script.async =
        true;


      script.dataset.sheetCallback =
        config.callback;


      script.onerror =

        function () {


          const container =

            document.getElementById(
              config.container
            );


          if (container) {


            container.innerHTML =

              '<div class="message">' +

              'Unable to Load Google Sheet Data' +

              '<br>' +

              'Check Google Sheet Sharing Permission' +

              '</div>';


          }


        };


      script.onload =

        function () {


          setTimeout(

            function () {


              if (
                script.parentNode
              ) {


                script.remove();


              }


            },

            1000

          );


        };


      document.head.appendChild(
        script
      );

    }



    /* =========================================================
       SCROLL TO LATEST DATA
    ========================================================= */

    function scrollTableToBottom(
      container
    ) {


      requestAnimationFrame(

        function () {


          requestAnimationFrame(

            function () {


              container.scrollTop =

                container.scrollHeight

                -

                container.clientHeight;


            }

          );


        }

      );

    }



    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(
      response,
      config
    ) {


      const container =

        document.getElementById(
          config.container
        );


      if (

        !response

        ||

        !response.table

      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Data Available' +

          '</div>';


        return;


      }



      const columns =

        response.table.cols || [];


      const originalRows =

        response.table.rows || [];



      /* =======================================================
         VISIBLE COLUMNS
      ======================================================= */

      const visibleColumns =

        getVisibleColumns(

          columns,

          originalRows,

          config

        );


      if (
        visibleColumns.length === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Data Available' +

          '</div>';


        return;


      }



      /* =======================================================
         REMOVE EMPTY ROWS
      ======================================================= */

      let rows =

        getNonEmptyRows(

          originalRows,

          visibleColumns

        );


      if (
        rows.length === 0
      ) {


        container.innerHTML =

          '<div class="message">' +

          'No Readings Available' +

          '</div>';


        return;


      }



      /* =======================================================
         SORT USING KEYED DATE + SAMPLING TIME

         NOT GOOGLE FORM TIMESTAMP
      ======================================================= */

      if (
        config.sortByDateTime
      ) {


        rows =

          sortRowsByDateTime(

            rows,

            columns

          );


      }



      const dateTimeColumns =

        findDateTimeColumns(
          columns
        );



      /* =======================================================
         FIND LATEST DATE
      ======================================================= */

      let latestDateValue =
        null;


      if (
        dateTimeColumns.dateIndex >= 0
      ) {


        rows.forEach(

          function (row) {


            const value =

              getRowDateValue(

                row,

                dateTimeColumns.dateIndex

              );


            if (

              Number.isFinite(
                value
              )

              &&

              (

                latestDateValue === null

                ||

                value > latestDateValue

              )

            ) {


              latestDateValue =
                value;


            }


          }

        );


      }



      /* =======================================================
         LOWEST VALUES
      ======================================================= */

      const lowestValues =

        config.highlightLowest

          ?

          findLowestValues(

            rows,

            visibleColumns

          )

          :

          new Map();



      /* =======================================================
         CREATE TABLE
      ======================================================= */

      const table =

        document.createElement(
          "table"
        );


      const thead =

        document.createElement(
          "thead"
        );


      const headerRow =

        document.createElement(
          "tr"
        );



      /* =======================================================
         HEADERS
      ======================================================= */

      visibleColumns.forEach(

        function (item) {


          const th =

            document.createElement(
              "th"
            );


          th.textContent =

            getDisplayHeaderName(

              item.column.label || ""

            );


          headerRow.appendChild(
            th
          );


        }

      );


      thead.appendChild(
        headerRow
      );


      table.appendChild(
        thead
      );



      /* =======================================================
         TABLE BODY
      ======================================================= */

      const tbody =

        document.createElement(
          "tbody"
        );


      const dateColourMap =
        new Map();


      let nextColourIndex =
        0;


      let previousDate =
        null;



      rows.forEach(

        function (row) {


          const tr =

            document.createElement(
              "tr"
            );



          /* =================================================
             DATE FOR THIS ROW
          ================================================= */

          const rowDate =

            dateTimeColumns.dateIndex >= 0

              ?

              getRowDateValue(

                row,

                dateTimeColumns.dateIndex

              )

              :

              null;



          /* =================================================
             DEW POINT DATE GROUP COLOUR
          ================================================= */

          if (

            config.groupByDate

            &&

            Number.isFinite(
              rowDate
            )

          ) {


            const dateKey =

              String(
                rowDate
              );


            if (

              !dateColourMap.has(
                dateKey
              )

            ) {


              dateColourMap.set(

                dateKey,

                nextColourIndex

                %

                DATE_GROUP_COLOUR_COUNT

              );


              nextColourIndex++;


            }


            const colourIndex =

              dateColourMap.get(
                dateKey
              );


            tr.classList.add(

              "date-group-" +

              colourIndex

            );



            /* ===============================================
               NEW DATE = THICK LINE
            =============================================== */

            if (

              previousDate !== null

              &&

              rowDate !== previousDate

            ) {


              tr.classList.add(
                "new-date-group"
              );


            }


            previousDate =
              rowDate;


          }



          /* =================================================
             ALL ROWS ON LATEST DATE = BOLD
          ================================================= */

          if (

            config.groupByDate

            &&

            latestDateValue !== null

            &&

            rowDate === latestDateValue

          ) {


            tr.classList.add(
              "latest-date"
            );


          }



          /* =================================================
             CELLS
          ================================================= */

          visibleColumns.forEach(

            function (item) {


              const td =

                document.createElement(
                  "td"
                );


              const cell =

                row.c

                  ?

                  row.c[
                    item.index
                  ]

                  :

                  null;


              const displayValue =

                getCellDisplayValue(
                  cell
                );


              td.textContent =
                displayValue;



              /* =============================================
                 LOWEST READING
              ============================================= */

              if (

                config.highlightLowest

                &&

                lowestValues.has(
                  item.index
                )

              ) {


                const number =

                  extractNumber(
                    displayValue
                  );


                const minimum =

                  lowestValues.get(
                    item.index
                  );


                if (

                  number !== null

                  &&

                  Math.abs(

                    number

                    -

                    minimum

                  )

                  < 0.000001

                ) {


                  td.classList.add(
                    "lowest-value"
                  );


                }


              }


              tr.appendChild(
                td
              );


            }

          );


          tbody.appendChild(
            tr
          );


        }

      );


      table.appendChild(
        tbody
      );


      container.innerHTML =
        "";


      container.appendChild(
        table
      );


      /*
         AUTOMATICALLY DISPLAY
         THE LATEST DATA
      */

      scrollTableToBottom(
        container
      );

    }



    /* =========================================================
       GOOGLE SHEET CALLBACKS
    ========================================================= */

    window.swabbingResponse =

      function (response) {


        renderTable(

          response,

          SWABBING

        );


      };



    window.dewPointResponse =

      function (response) {


        renderTable(

          response,

          DEW_POINT

        );


      };



    /* =========================================================
       LOAD BOTH TABLES
    ========================================================= */

    function loadAllTables() {


      loadSheet(
        SWABBING
      );


      loadSheet(
        DEW_POINT
      );


    }



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadAllTables();



    /* =========================================================
       AUTO REFRESH GOOGLE SHEETS

       EVERY 60 SECONDS
    ========================================================= */

    setInterval(

      loadAllTables,

      TABLE_REFRESH_TIME

    );


  </script>
