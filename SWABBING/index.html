<script>

/* =========================================================
   EXTRACT SWABBING GRAPH DATA

   RULES
   -----
   BF / BF14 = ALWAYS NUMBERED
   BD HS      = UNNUMBERED UNLESS SHEET HAS REAL PIG NO.
   CCF        = UNNUMBERED UNLESS SHEET HAS REAL PIG NO.

   BD HS / CCF DO NOT CREATE EXTRA PIG NUMBERS.
========================================================= */

function extractSwabbingGraphData(
  columns,
  rows
) {

  const pigIndex =
    findAnyColumn(
      columns,
      [
        "PIG NO.",
        "PIG NO",
        "PIG NUMBER",
        "PIG SEQUENCE"
      ]
    );


  const typeIndex =
    findAnyColumn(
      columns,
      [
        "PIG TYPE",
        "TYPE",
        "PIG DESCRIPTION",
        "DESCRIPTION"
      ]
    );


  const runIndex =
    findAnyColumn(
      columns,
      [
        "SWABBING RUN",
        "RUN NO.",
        "RUN NO",
        "RUN"
      ]
    );


  const beforeIndex =
    findColumnAllWords(
      columns,
      [
        "BEFORE"
      ]
    );


  const afterIndex =
    findColumnAllWords(
      columns,
      [
        "AFTER"
      ]
    );


  const gainIndex =
    findColumnAllWords(
      columns,
      [
        "GAIN"
      ]
    );


  const result = [];


  /* =======================================================
     FIRST PASS

     READ ONLY REAL SHEET DATA.
  ======================================================= */

  rows.forEach(

    function (row) {


      const pigRaw =
        pigIndex >= 0

          ?

          String(
            getCellDisplayValue(
              row.c
                ?
                row.c[pigIndex]
                :
                null
            )
          ).trim()

          :

          "";


      const typeRaw =
        typeIndex >= 0

          ?

          String(
            getCellDisplayValue(
              row.c
                ?
                row.c[typeIndex]
                :
                null
            )
          ).trim()

          :

          "";


      const runRaw =
        runIndex >= 0

          ?

          String(
            getCellDisplayValue(
              row.c
                ?
                row.c[runIndex]
                :
                null
            )
          ).trim()

          :

          "";


      if (
        isSummaryRowLabel(pigRaw)
        ||
        isSummaryRowLabel(typeRaw)
      ) {

        return;

      }


      /*
         REAL PIG NUMBER FROM SHEET
      */

      const actualPigNo =
        parsePigNumber(
          pigRaw
        );


      /*
         IF PIG NO CELL ITSELF CONTAINS
         "BD HS", "CCF", ETC.,
         TREAT IT AS TYPE.
      */

      let rawType =
        typeRaw;


      if (
        !rawType
        &&
        actualPigNo === null
        &&
        pigRaw
      ) {

        rawType =
          pigRaw;

      }


      const shortType =
        getShortPigType(
          rawType
        );


      if (
        actualPigNo === null
        &&
        !shortType
      ) {

        return;

      }


      const before =
        beforeIndex >= 0

          ?

          extractNumber(
            getCellDisplayValue(
              row.c
                ?
                row.c[beforeIndex]
                :
                null
            )
          )

          :

          null;


      const after =
        afterIndex >= 0

          ?

          extractNumber(
            getCellDisplayValue(
              row.c
                ?
                row.c[afterIndex]
                :
                null
            )
          )

          :

          null;


      let gain =
        gainIndex >= 0

          ?

          extractNumber(
            getCellDisplayValue(
              row.c
                ?
                row.c[gainIndex]
                :
                null
            )
          )

          :

          null;


      if (
        gain === null
        &&
        before !== null
        &&
        after !== null
      ) {

        gain =
          after - before;

      }


      result.push({

        /*
           ORIGINAL NUMBER FROM SHEET
        */

        actualPigNo,

        /*
           DISPLAY NUMBER WILL BE
           CALCULATED BELOW.
        */

        pigNo:
          actualPigNo,

        type:
          shortType,

        run:
          runRaw,

        runNo:
          parseRunNumber(
            runRaw
          ),

        before,

        after,

        gain

      });

    }

  );



  /* =======================================================
     SECOND PASS

     NUMBER BF / BF14 ONLY.

     BD HS AND CCF DO NOT CONSUME A NUMBER.

     EXAMPLE:

     1 BF
     2 BF
     3 BF
     BD HS
     4 BF
     5 BF14
     CCF
     6 BF
  ======================================================= */

  let lastNumber =
    0;


  result.forEach(

    function (item) {


      /*
         IF GOOGLE SHEET ALREADY HAS
         AN ACTUAL NUMBER, USE IT.
      */

      if (
        Number.isFinite(
          item.actualPigNo
        )
      ) {

        item.pigNo =
          item.actualPigNo;


        if (
          item.actualPigNo >
          lastNumber
        ) {

          lastNumber =
            item.actualPigNo;

        }


        return;

      }



      /*
         ONLY BF AND BF14 GET
         AUTO-SEQUENTIAL NUMBER.
      */

      if (
        item.type === "BF"
        ||
        item.type === "BF14"
      ) {

        lastNumber++;

        item.pigNo =
          lastNumber;

      }

      else {

        /*
           BD HS / CCF REMAIN
           UNNUMBERED.
        */

        item.pigNo =
          null;

      }

    }

  );


  return result;

}



/* =========================================================
   SWABBING GRAPH
========================================================= */

function renderSwabbingGraph(
  columns,
  rows
) {

  const wrapper =
    document.getElementById(
      "swabbingGraphWrapper"
    );


  const title =
    document.getElementById(
      "swabbingGraphTitle"
    );


  const info =
    document.getElementById(
      "swabbingGraphCount"
    );


  const data =
    extractSwabbingGraphData(
      columns,
      rows
    );


  if (
    !data.length
  ) {

    wrapper.innerHTML =
      '<div class="chart-message">No Swabbing Pig Data</div>';

    return;

  }



  /* =======================================================
     LATEST PIG

     BF / BF14 NUMBER SEQUENCE ONLY.

     BD HS / CCF DO NOT INCREASE THIS.
  ======================================================= */

  const numberedPigs =
    data.filter(
      item =>
        Number.isFinite(
          item.pigNo
        )
    );


  const latestPig =
    numberedPigs.length

      ?

      Math.max(
        ...numberedPigs.map(
          item =>
            item.pigNo
        )
      )

      :

      null;



  /* =======================================================
     LATEST RUN
  ======================================================= */

  const validRuns =
    data
    .map(
      item =>
        item.runNo
    )
    .filter(
      Number.isFinite
    );


  const latestRun =
    validRuns.length

      ?

      Math.max(
        ...validRuns
      )

      :

      null;



  /* =======================================================
     GRAPH TITLE
  ======================================================= */

  if (
    latestPig !== null
    &&
    latestRun !== null
  ) {

    title.textContent =

      "SWABBING PIG WEIGHT COMPARISON — LATEST PIG "

      +

      latestPig

      +

      " · SWABBING RUN "

      +

      latestRun;

  }

  else {

    title.textContent =
      "SWABBING PIG WEIGHT COMPARISON";

  }



  info.textContent =

    numberedPigs.length

    +

    " NUMBERED PIGS"

    +

    (
      latestPig !== null

        ?

        " · LATEST PIG "
        +
        latestPig

        :

        ""
    )

    +

    (
      latestRun !== null

        ?

        " · LATEST RUN "
        +
        latestRun

        :

        ""
    )

    +

    " · AUTO REFRESH 60 SEC";



  /* =======================================================
     GRAPH SIZE
  ======================================================= */

  const stepX =
    window.innerWidth <= 700
      ?
      82
      :
      90;


  const left =
    70;


  const right =
    45;


  const width =
    Math.max(

      wrapper.clientWidth,

      left
      +
      right
      +
      data.length
      *
      stepX

    );


  const height =
    490;


  const top =
    30;


  const plotBottom =
    305;


  const plotHeight =
    plotBottom -
    top;



  /* =======================================================
     Y SCALE
  ======================================================= */

  let maxValue =
    0;


  data.forEach(

    function (item) {

      [
        item.before,
        item.after,
        item.gain
      ]
      .forEach(

        function (value) {

          if (
            Number.isFinite(
              value
            )
            &&
            value >
            maxValue
          ) {

            maxValue =
              value;

          }

        }

      );

    }

  );


  let yMax =
    Math.ceil(
      maxValue + 1
    );


  if (
    yMax < 5
  ) {

    yMax =
      5;

  }


  const yStep =
    yMax <= 12
      ?
      1
      :
      2;



  function xPos(index) {

    return (

      left

      +

      index
      *
      stepX

      +

      stepX / 2

    );

  }



  function yPos(value) {

    return (

      plotBottom

      -

      (
        value /
        yMax
      )
      *
      plotHeight

    );

  }



  let svg =

    `<svg
      class="swabbing-chart"
      xmlns="http://www.w3.org/2000/svg"
      width="${width}"
      height="${height}"
      viewBox="0 0 ${width} ${height}"
    >`;


  svg +=

    `<rect
      width="${width}"
      height="${height}"
      fill="#ffffff"
    />`;



  /* =======================================================
     Y GRID
  ======================================================= */

  for (
    let value = 0;
    value <= yMax;
    value += yStep
  ) {

    const py =
      yPos(
        value
      );


    svg +=

      `<line
        x1="${left}"
        y1="${py}"
        x2="${width-right}"
        y2="${py}"
        stroke="#dddddd"
        stroke-dasharray="4 3"
      />`;


    svg +=

      `<text
        x="${left-12}"
        y="${py+4}"
        text-anchor="end"
        font-family="Arial"
        font-size="11"
        font-weight="700"
      >${value}</text>`;

  }



  /* =======================================================
     DASHED RUN SEPARATOR

     DRAW DASHED LINE BETWEEN
     SWABBING RUNS.
  ======================================================= */

  for (
    let i = 1;
    i < data.length;
    i++
  ) {

    const previousRun =
      normalizeText(
        data[i-1].run
      );


    const currentRun =
      normalizeText(
        data[i].run
      );


    if (
      previousRun
      &&
      currentRun
      &&
      previousRun !==
      currentRun
    ) {

      const separatorX =
        (
          xPos(i-1)
          +
          xPos(i)
        )
        /
        2;


      svg +=

        `<line
          x1="${separatorX}"
          y1="${top}"
          x2="${separatorX}"
          y2="405"
          stroke="#777777"
          stroke-width="1.2"
          stroke-dasharray="5 5"
          opacity="0.85"
        />`;

    }

  }



  /* =======================================================
     AXES
  ======================================================= */

  svg +=

    `<line
      x1="${left}"
      y1="${top}"
      x2="${left}"
      y2="${plotBottom}"
      stroke="#111111"
      stroke-width="1.3"
    />`;


  svg +=

    `<line
      x1="${left}"
      y1="${plotBottom}"
      x2="${width-right}"
      y2="${plotBottom}"
      stroke="#111111"
      stroke-width="1.3"
    />`;



  /* =======================================================
     WEIGHT BARS
  ======================================================= */

  const barWidth =
    16;


  data.forEach(

    function (
      item,
      index
    ) {

      const px =
        xPos(
          index
        );


      /* BEFORE */

      if (
        Number.isFinite(
          item.before
        )
      ) {

        const py =
          yPos(
            item.before
          );


        svg +=

          `<rect
            x="${px-barWidth-2}"
            y="${py}"
            width="${barWidth}"
            height="${plotBottom-py}"
            fill="#2878ad"
          />`;


        svg +=

          `<text
            x="${px-10}"
            y="${Math.max(15,py-7)}"
            text-anchor="middle"
            font-family="Arial"
            font-size="10"
            font-weight="900"
            fill="#14598a"
          >${item.before.toFixed(2)}</text>`;

      }



      /* AFTER */

      if (
        Number.isFinite(
          item.after
        )
      ) {

        const py =
          yPos(
            item.after
          );


        svg +=

          `<rect
            x="${px+2}"
            y="${py}"
            width="${barWidth}"
            height="${plotBottom-py}"
            fill="#ff7600"
          />`;


        svg +=

          `<text
            x="${px+10}"
            y="${Math.max(15,py-7)}"
            text-anchor="middle"
            font-family="Arial"
            font-size="10"
            font-weight="900"
            fill="#e55f00"
          >${item.after.toFixed(2)}</text>`;

      }

    }

  );



  /* =======================================================
     WEIGHT GAIN LINE
  ======================================================= */

  const gainPoints =
    data
    .map(

      function (
        item,
        index
      ) {

        return {
          index,
          gain:
            item.gain
        };

      }

    )
    .filter(

      item =>
        Number.isFinite(
          item.gain
        )

    );


  if (
    gainPoints.length >
    1
  ) {

    svg +=

      `<polyline
        points="${gainPoints.map(

          item =>
            `${xPos(item.index)},${yPos(item.gain)}`

        ).join(" ")}"
        fill="none"
        stroke="#75117e"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />`;

  }



  gainPoints.forEach(

    function (point) {

      const px =
        xPos(
          point.index
        );


      const py =
        yPos(
          point.gain
        );


      svg +=

        `<circle
          cx="${px}"
          cy="${py}"
          r="4.5"
          fill="#75117e"
        />`;


      svg +=

        `<text
          x="${px}"
          y="${Math.max(16,py-9)}"
          text-anchor="middle"
          font-family="Arial"
          font-size="10"
          font-weight="900"
          fill="#75117e"
        >${point.gain.toFixed(2)}</text>`;

    }

  );



  /* =======================================================
     WEIGHT GAIN TREND
  ======================================================= */

  const trend =
    calculateGainTrend(
      data
    );


  if (
    trend
    &&
    data.length > 1
  ) {

    const first =
      Math.max(
        0,
        trend.intercept
      );


    const last =
      Math.max(

        0,

        trend.intercept

        +

        trend.slope
        *
        (
          data.length - 1
        )

      );


    svg +=

      `<line
        x1="${xPos(0)}"
        y1="${yPos(first)}"
        x2="${xPos(data.length-1)}"
        y2="${yPos(last)}"
        stroke="#e31b23"
        stroke-width="2"
        stroke-dasharray="8 5"
      />`;

  }



  /* =======================================================
     PIG NUMBER + TYPE LABEL

     BF / BF14:

        19
        BF14

     BD HS:

        BD HS

     CCF:

        CCF
  ======================================================= */

  data.forEach(

    function (
      item,
      index
    ) {

      const px =
        xPos(
          index
        );


      /*
         BF / BF14

         NUMBER ON TOP.
         TYPE UNDER NUMBER.
      */

      if (
        item.type === "BF"
        ||
        item.type === "BF14"
      ) {

        svg +=

          `<text
            x="${px}"
            y="326"
            text-anchor="middle"
            font-family="Arial"
            font-size="12"
            font-weight="900"
            fill="#111111"
          >${Number.isFinite(item.pigNo) ? item.pigNo : ""}</text>`;


        svg +=

          `<text
            x="${px}"
            y="347"
            text-anchor="middle"
            font-family="Arial"
            font-size="11"
            font-weight="900"
            fill="#555555"
          >${escapeHtml(item.type)}</text>`;

      }


      /*
         OTHER NUMBERED PIG TYPE
      */

      else if (
        Number.isFinite(
          item.pigNo
        )
      ) {

        svg +=

          `<text
            x="${px}"
            y="326"
            text-anchor="middle"
            font-family="Arial"
            font-size="12"
            font-weight="900"
          >${item.pigNo}</text>`;


        if (
          item.type
        ) {

          svg +=

            `<text
              x="${px}"
              y="347"
              text-anchor="middle"
              font-family="Arial"
              font-size="11"
              font-weight="900"
              fill="#555555"
            >${escapeHtml(item.type)}</text>`;

        }

      }


      /*
         BD HS / CCF

         TYPE ONLY.
      */

      else {

        svg +=

          `<text
            x="${px}"
            y="338"
            text-anchor="middle"
            font-family="Arial"
            font-size="11"
            font-weight="900"
            fill="#111111"
          >${escapeHtml(item.type)}</text>`;

      }

    }

  );



  /* =======================================================
     SWABBING RUN BRACKETS

              └─────────────┘
                SWABBING RUN 7
  ======================================================= */

  let groupStart =
    0;


  for (
    let i = 1;
    i <= data.length;
    i++
  ) {

    const startItem =
      data[
        groupStart
      ];


    const nextItem =
      i < data.length

        ?

        data[i]

        :

        null;


    const sameRun =
      nextItem

      &&

      normalizeText(
        nextItem.run
      )
      ===
      normalizeText(
        startItem.run
      );


    if (
      sameRun
    ) {

      continue;

    }


    if (
      startItem.run
    ) {

      const x1 =
        xPos(
          groupStart
        )
        -
        stepX * .38;


      const x2 =
        xPos(
          i - 1
        )
        +
        stepX * .38;


      const bracketY =
        380;


      /*
         HORIZONTAL BRACKET
      */

      svg +=

        `<line
          x1="${x1}"
          y1="${bracketY}"
          x2="${x2}"
          y2="${bracketY}"
          stroke="#222222"
          stroke-width="1.5"
        />`;


      /*
         LEFT END
      */

      svg +=

        `<line
          x1="${x1}"
          y1="${bracketY-7}"
          x2="${x1}"
          y2="${bracketY}"
          stroke="#222222"
          stroke-width="1.5"
        />`;


      /*
         RIGHT END
      */

      svg +=

        `<line
          x1="${x2}"
          y1="${bracketY-7}"
          x2="${x2}"
          y2="${bracketY}"
          stroke="#222222"
          stroke-width="1.5"
        />`;


      /*
         RUN LABEL
      */

      svg +=

        `<text
          x="${(x1+x2)/2}"
          y="402"
          text-anchor="middle"
          font-family="Arial"
          font-size="10"
          font-weight="900"
          fill="#111111"
        >${escapeHtml(
          formatRunLabel(
            startItem.run
          )
        )}</text>`;

    }


    groupStart =
      i;

  }



  /* =======================================================
     Y TITLE
  ======================================================= */

  svg +=

    `<text
      x="18"
      y="${(top+plotBottom)/2}"
      transform="rotate(-90 18 ${(top+plotBottom)/2})"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="900"
    >WEIGHT (KG)</text>`;



  /* =======================================================
     X TITLE
  ======================================================= */

  svg +=

    `<text
      x="${width/2}"
      y="456"
      text-anchor="middle"
      font-family="Arial"
      font-size="13"
      font-weight="900"
    >PIG NO. / TYPE · SWABBING RUN</text>`;


  svg +=
    `</svg>`;


  wrapper.innerHTML =
    svg;


  requestAnimationFrame(

    function () {

      wrapper.scrollLeft =

        wrapper.scrollWidth

        -

        wrapper.clientWidth;

    }

  );

}

</script>
