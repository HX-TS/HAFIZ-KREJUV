<style>

/* =========================================================
   GLOBAL
   ========================================================= */

:root {
    --bg: #f4f1eb;
    --black: #050505;
    --border: #aaa69f;
    --muted: #77736d;
    --outer-margin: 30px;
}


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {
    background: var(--black);
    color: var(--black);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}



/* =========================================================
   MAIN PAGE
   ========================================================= */

.page {
    position: fixed;

    top: var(--outer-margin);
    right: var(--outer-margin);
    bottom: var(--outer-margin);
    left: var(--outer-margin);

    background: var(--bg);

    display: grid;

    grid-template-rows:
        42%
        18px
        1fr
        58px;

    overflow: hidden;
}



/* =========================================================
   HERO
   ========================================================= */

.hero {
    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px 40px;

    background: var(--bg);
}


.hero-inner {
    width: 100%;
}



/* =========================================================
   MAIN TITLE
   ========================================================= */

.hero-title {
    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            80px,
            8.7vw,
            170px
        );

    font-weight: 900;

    line-height: 0.80;

    text-transform: uppercase;
}



/* =========================================================
   KREJUV FEC
   WIDER SPACING
   ========================================================= */

.krejuv-title {
    display: inline-block;

    letter-spacing: 0.08em;

    padding-left: 0.08em;
}



/* =========================================================
   BOOKMARK
   ========================================================= */

.bookmark-title {
    display: inline-block;

    letter-spacing: -0.075em;
}



/* =========================================================
   TECHSMITH BELOW TITLE
   ========================================================= */

.hero-subtitle {
    margin-top: 35px;

    font-size:
        clamp(
            13px,
            1vw,
            19px
        );

    font-weight: 700;

    letter-spacing: 0.16em;
}



/* =========================================================
   BLACK DIVIDER
   ========================================================= */

.section-divider {
    width: 100%;

    background: var(--black);
}



/* =========================================================
   CONTENT
   ========================================================= */

.content {
    background: var(--bg);

    display: grid;

    grid-template-rows:
        58px
        1fr;

    min-height: 0;
}



/* =========================================================
   COLUMN TITLES
   ========================================================= */

.content-header {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    border-bottom:
        1px solid var(--border);
}


.content-header > div {
    display: flex;
    align-items: center;

    padding: 0 18px;

    font-size: 11px;
    font-weight: 900;

    letter-spacing: 0.02em;

    text-transform: uppercase;
}


.content-header > div + div {
    border-left:
        1px solid var(--border);
}



/* =========================================================
   THREE COLUMNS
   ========================================================= */

.columns {
    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    min-height: 0;
}


.column {
    position: relative;

    min-width: 0;
    min-height: 0;

    padding:
        18px
        18px
        25px;
}


.column + .column {
    border-left:
        1px solid var(--border);
}



/* =========================================================
   COLUMN SUBHEADING
   ========================================================= */

.column-label {
    margin-bottom: 15px;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 0.02em;

    text-transform: uppercase;
}



/* =========================================================
   MAIN SITE LINKS
   ========================================================= */

.site-item {
    display: block;

    width: fit-content;

    position: relative;

    color: var(--black);

    text-decoration: none;

    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            28px,
            2.25vw,
            45px
        );

    font-weight: 900;

    line-height: 0.96;

    letter-spacing: -0.055em;

    text-transform: uppercase;

    margin-bottom: 5px;

    transition:
        transform 0.18s ease,
        opacity 0.18s ease;
}



/* =========================================================
   MAIN SITE HOVER
   ========================================================= */

.site-item:hover {
    transform:
        translateX(10px);
}


.site-item::after {
    content: "↗";

    position: absolute;

    left:
        calc(100% + 12px);

    top: 50%;

    transform:
        translateY(-50%);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 0.34em;

    opacity: 0;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}


.site-item:hover::after {
    opacity: 1;

    transform:
        translate(
            5px,
            -50%
        );
}



/* =========================================================
   FADE OTHER MAIN SITE LINKS
   ========================================================= */

.columns:has(.site-item:hover)
.site-item:not(:hover) {
    opacity: 0.25;
}



/* =========================================================
   EJHA NUMBER
   ========================================================= */

.ejha-item {
    display: inline-block;

    position: relative;

    color: var(--black);

    text-decoration: none;

    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            16px,
            1.15vw,
            23px
        );

    font-weight: 900;

    line-height: 1;

    letter-spacing: -0.035em;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        opacity 0.18s ease;
}


.ejha-item:hover,
.ejha-item:focus {
    transform:
        translateX(7px);

    outline: none;
}



/* =========================================================
   EJHA ARROW
   ========================================================= */

.ejha-item::after {
    content: "↗";

    position: absolute;

    left:
        calc(100% + 8px);

    top: 50%;

    transform:
        translateY(-50%);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 0.55em;

    opacity: 0;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}


.ejha-item:hover::after {
    opacity: 1;

    transform:
        translate(
            4px,
            -50%
        );
}



/* =========================================================
   EPTW COLUMN
   ========================================================= */

.eptw-column {
    padding: 18px;
}



/* =========================================================
   MODERN EPTW TABLE
   ========================================================= */

.eptw-table {
    width: 100%;

    border:
        1px solid
        rgba(5, 5, 5, 0.12);

    background:
        rgba(255, 255, 255, 0.08);

    overflow: hidden;
}



/* =========================================================
   EPTW TABLE ROW
   ========================================================= */

.eptw-table-row {
    display: grid;

    grid-template-columns:
        0.75fr
        1.25fr;
}


.eptw-table-row + .eptw-table-row {
    border-top:
        1px solid
        rgba(5, 5, 5, 0.12);
}



/* =========================================================
   EPTW TABLE CELL
   ========================================================= */

.eptw-cell {
    min-width: 0;

    min-height: 52px;

    display: flex;
    align-items: center;

    padding:
        12px
        15px;
}


.eptw-cell + .eptw-cell {
    border-left:
        1px solid
        rgba(5, 5, 5, 0.10);
}



/* =========================================================
   EPTW TABLE HEADER
   ========================================================= */

.eptw-table-header {
    font-size: 9px;

    font-weight: 900;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    color:
        rgba(5, 5, 5, 0.60);
}


.eptw-table-header .eptw-cell {
    min-height: 40px;
}



/* =========================================================
   EPTW LOCATION
   ========================================================= */

.eptw-location {
    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            15px,
            1vw,
            19px
        );

    font-weight: 900;

    letter-spacing: -0.025em;

    text-transform: uppercase;
}



/* =========================================================
   EPTW NUMBER
   ========================================================= */

.eptw-item {
    display: inline-block;

    position: relative;

    color: var(--black);

    text-decoration: none;

    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            16px,
            1.15vw,
            23px
        );

    font-weight: 900;

    line-height: 1;

    letter-spacing: -0.035em;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        opacity 0.18s ease;
}


.eptw-item:hover,
.eptw-item:focus {
    transform:
        translateX(5px);

    opacity: 0.55;

    outline: none;
}



/* =========================================================
   TOOLTIP
   EJHA + EPTW
   ========================================================= */

.tooltip {
    position: fixed;

    width:
        min(
            580px,
            calc(100vw - 80px)
        );

    background: var(--black);

    color: var(--bg);

    padding: 22px;

    font-size: 13px;

    font-weight: 700;

    line-height: 1.55;

    text-transform: uppercase;

    z-index: 9999;

    pointer-events: none;

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(8px);

    transition:
        opacity 0.15s ease,
        transform 0.15s ease,
        visibility 0.15s ease;
}


.tooltip.active {
    opacity: 1;

    visibility: visible;

    transform:
        translateY(0);
}


.tooltip-number {
    display: block;

    margin-bottom: 12px;

    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size: 20px;

    font-weight: 900;
}



/* =========================================================
   FOOTER
   ========================================================= */

.footer {
    width: 100%;

    background: var(--bg);

    border-top:
        1px solid var(--border);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0 18px;

    text-align: center;

    font-family:
        "Arial Black",
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 0.08em;

    text-transform: uppercase;
}



/* =========================================================
   HP VICTUS / LARGE SCREEN
   ========================================================= */

@media
(min-width: 1600px)
and
(min-height: 850px) {

    :root {
        --outer-margin: 30px;
    }


    .hero-title {
        font-size: 165px;
    }


    .site-item {
        font-size: 42px;
    }


    .ejha-item,
    .eptw-item {
        font-size: 21px;
    }


    .eptw-location {
        font-size: 18px;
    }

}



/* =========================================================
   SMALLER LAPTOP
   ========================================================= */

@media
(max-height: 800px)
and
(min-width: 801px) {

    :root {
        --outer-margin: 20px;
    }


    .page {
        grid-template-rows:
            38%
            15px
            1fr
            45px;
    }


    .hero-title {
        font-size:
            clamp(
                65px,
                8vw,
                130px
            );
    }


    .hero-subtitle {
        margin-top: 20px;
    }


    .content {
        grid-template-rows:
            45px
            1fr;
    }

}



/* =========================================================
   PHONE / TABLET
   ========================================================= */

@media
(max-width: 800px) {

    :root {
        --outer-margin: 12px;
    }


    html,
    body {
        min-height: 100%;
    }


    body {
        overflow-x: hidden;
        overflow-y: auto;

        background: var(--black);
    }



    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
        position: relative;

        top: auto;
        right: auto;
        bottom: auto;
        left: auto;

        width:
            calc(
                100% -
                (var(--outer-margin) * 2)
            );

        min-height:
            calc(
                100vh -
                (var(--outer-margin) * 2)
            );

        min-height:
            calc(
                100svh -
                (var(--outer-margin) * 2)
            );

        margin:
            var(--outer-margin);

        display: flex;

        flex-direction: column;

        overflow: hidden;
    }



    /* =====================================================
       HERO
       ===================================================== */

    .hero {
        min-height: 310px;

        flex-shrink: 0;

        padding:
            35px
            12px
            30px;
    }


    .hero-title {
        font-size:
            clamp(
                42px,
                12vw,
                90px
            );

        line-height: 0.84;
    }


    .krejuv-title {
        letter-spacing: 0.04em;

        padding-left: 0.04em;
    }


    .bookmark-title {
        letter-spacing: -0.055em;
    }


    .hero-subtitle {
        margin-top: 25px;

        font-size: 12px;
    }



    /* =====================================================
       DIVIDER
       ===================================================== */

    .section-divider {
        height: 14px;

        flex-shrink: 0;
    }



    /* =====================================================
       CONTENT
       ===================================================== */

    .content {
        display: block;

        flex: 1;

        min-height: 0;
    }


    .content-header {
        display: none;
    }



    /* =====================================================
       MOBILE COLUMNS
       ===================================================== */

    .columns {
        display: block;
    }


    .column {
        min-height: 150px;

        padding:
            18px
            16px
            24px;
    }


    .column + .column {
        border-left: none;

        border-top:
            1px solid
            var(--border);
    }



    /* =====================================================
       MOBILE COLUMN TITLES
       ===================================================== */

    .column::before {
        display: block;

        margin-bottom: 18px;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 0.04em;

        text-transform: uppercase;
    }


    .column:nth-child(1)::before {
        content: "MAIN SITE";
    }


    .column:nth-child(2)::before {
        content: "EJHA";
    }


    .column:nth-child(3)::before {
        content: "EPTW";
    }



    /* =====================================================
       COLUMN LABEL
       ===================================================== */

    .column-label {
        margin-bottom: 10px;

        font-size: 10px;
    }



    /* =====================================================
       MAIN SITE
       ===================================================== */

    .site-item {
        font-size:
            clamp(
                27px,
                7vw,
                45px
            );

        margin-bottom: 7px;
    }



    /* =====================================================
       EJHA
       ===================================================== */

    .ejha-item {
        font-size:
            clamp(
                16px,
                4vw,
                22px
            );
    }



    /* =====================================================
       EPTW MOBILE TABLE
       ===================================================== */

    .eptw-column {
        padding:
            18px
            16px
            24px;
    }


    .eptw-table {
        width: 100%;
    }


    .eptw-table-row {
        grid-template-columns:
            0.8fr
            1.2fr;
    }


    .eptw-cell {
        min-height: 46px;

        padding:
            9px
            10px;
    }


    .eptw-table-header .eptw-cell {
        min-height: 36px;
    }


    .eptw-location {
        font-size: 14px;
    }


    .eptw-item {
        font-size: 16px;
    }



    /* =====================================================
       FOOTER
       ALWAYS CENTER BOTTOM
       ===================================================== */

    .footer {
        width: 100%;

        min-height: 55px;

        flex-shrink: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        margin-top: auto;

        padding: 0 15px;

        text-align: center;

        font-size: 10px;
    }



    /* =====================================================
       MOBILE TOOLTIP
       ===================================================== */

    .tooltip {
        width:
            calc(
                100vw - 40px
            );

        max-width: none;

        padding: 18px;

        font-size: 11px;

        line-height: 1.5;
    }


    .tooltip-number {
        font-size: 17px;
    }

}



/* =========================================================
   SMALL PHONE
   ========================================================= */

@media
(max-width: 480px) {

    :root {
        --outer-margin: 8px;
    }


    .hero {
        min-height: 270px;

        padding:
            25px
            8px;
    }


    .hero-title {
        font-size:
            clamp(
                36px,
                11vw,
                62px
            );
    }


    .krejuv-title {
        letter-spacing: 0.025em;

        padding-left: 0.025em;
    }


    .hero-subtitle {
        margin-top: 20px;

        font-size: 10px;
    }


    .column {
        min-height: 135px;

        padding:
            15px
            14px
            22px;
    }


    .site-item {
        font-size:
            clamp(
                24px,
                6.8vw,
                35px
            );
    }


    .eptw-table-row {
        grid-template-columns:
            0.75fr
            1.25fr;
    }


    .eptw-cell {
        padding:
            8px
            8px;
    }


    .eptw-location {
        font-size: 13px;
    }


    .eptw-item {
        font-size: 15px;
    }


    .footer {
        min-height: 50px;

        font-size: 9px;
    }

}



/* =========================================================
   PHONE LANDSCAPE
   ========================================================= */

@media
(max-width: 800px)
and
(max-height: 500px)
and
(orientation: landscape) {

    .hero {
        min-height: 220px;
    }


    .hero-title {
        font-size:
            clamp(
                42px,
                9vw,
                72px
            );
    }


    .hero-subtitle {
        margin-top: 15px;
    }


    .column {
        min-height: 120px;
    }

}

</style>

</head>

<!-- =========================================================
     TOOLTIP
     ========================================================= -->

<div
    id="tooltip"
    class="tooltip"
>

    <span
        id="tooltipNumber"
        class="tooltip-number"
    ></span>

    <span
        id="tooltipDescription"
    ></span>

</div>



<script>

/* =========================================================
   EJHA + EPTW HOVER ITEMS
   ========================================================= */

const hoverItems =
    document.querySelectorAll(
        ".ejha-item, .eptw-item"
    );


const tooltip =
    document.getElementById(
        "tooltip"
    );


const tooltipNumber =
    document.getElementById(
        "tooltipNumber"
    );


const tooltipDescription =
    document.getElementById(
        "tooltipDescription"
    );



/* =========================================================
   SHOW TOOLTIP
   ========================================================= */

function showTooltip(item) {

    tooltipNumber.textContent =
        item.dataset.number || "";

    tooltipDescription.textContent =
        item.dataset.description || "";

    tooltip.classList.add(
        "active"
    );

}



/* =========================================================
   HIDE TOOLTIP
   ========================================================= */

function hideTooltip() {

    tooltip.classList.remove(
        "active"
    );

}



/* =========================================================
   POSITION TOOLTIP
   ========================================================= */

function positionTooltip(
    x,
    y
) {

    const padding = 20;

    const offset = 22;


    const tooltipWidth =
        tooltip.offsetWidth;


    const tooltipHeight =
        tooltip.offsetHeight;


    let left =
        x + offset;


    let top =
        y + offset;



    /* RIGHT EDGE */

    if (
        left +
        tooltipWidth >
        window.innerWidth -
        padding
    ) {

        left =
            x -
            tooltipWidth -
            offset;

    }



    /* BOTTOM EDGE */

    if (
        top +
        tooltipHeight >
        window.innerHeight -
        padding
    ) {

        top =
            y -
            tooltipHeight -
            offset;

    }



    /* LEFT EDGE */

    if (
        left <
        padding
    ) {

        left =
            padding;

    }



    /* TOP EDGE */

    if (
        top <
        padding
    ) {

        top =
            padding;

    }



    tooltip.style.left =
        `${left}px`;


    tooltip.style.top =
        `${top}px`;

}



/* =========================================================
   HOVER EVENTS
   ========================================================= */

hoverItems.forEach(item => {


    item.addEventListener(
        "mouseenter",
        event => {

            showTooltip(item);

            positionTooltip(
                event.clientX,
                event.clientY
            );

        }
    );


    item.addEventListener(
        "mousemove",
        event => {

            positionTooltip(
                event.clientX,
                event.clientY
            );

        }
    );


    item.addEventListener(
        "mouseleave",
        hideTooltip
    );


    /* =====================================================
       KEYBOARD FOCUS
       ===================================================== */

    item.addEventListener(
        "focus",
        () => {

            showTooltip(item);


            const rect =
                item.getBoundingClientRect();


            positionTooltip(
                rect.left,
                rect.bottom
            );

        }
    );


    item.addEventListener(
        "blur",
        hideTooltip
    );


});



/* =========================================================
   CLOSE TOOLTIP WHEN SCROLLING
   ========================================================= */

window.addEventListener(
    "scroll",
    hideTooltip,
    {
        passive: true
    }
);



/* =========================================================
   ESCAPE KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            hideTooltip();

        }

    }
);

</script>
